id: exposed-elasticsearch-api

info:
  name: Exposed Elasticsearch And OpenSearch API Without Authentication
  author: p3i
  severity: high
  description: Detects unauthenticated Elasticsearch and OpenSearch HTTP APIs that expose cluster health, index names, mappings, and stored data. Commonly contains PII, credentials, logs, and application data.
  tags: exposure,elasticsearch,opensearch,database,api,nosql
  metadata:
    max-request: 24

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{es_path}}"

    payloads:
      es_path:
        - "_cluster/health"
        - "_cluster/health?pretty"
        - "_cluster/stats"
        - "_cat/indices"
        - "_cat/indices?v"
        - "_cat/indices?v&h=index,docs.count,store.size"
        - "_cat/nodes"
        - "_cat/nodes?v"
        - "_cat/aliases"
        - "_nodes"
        - "_nodes/stats"
        - "_mapping"
        - "_aliases"
        - "_stats"
        - "_count"
        - "_search?pretty&size=1"
        - "_all/_search?pretty&size=1"
        - "_all/_mapping"
        - "_all/_count"
        - "_security/user/_search"
        - "es/_cluster/health"
        - "elasticsearch/_cluster/health"
        - "opensearch/_cluster/health"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "\"cluster_name\""
          - "\"number_of_nodes\""
          - "\"number_of_data_nodes\""
          - "\"cluster_uuid\""
          - "\"active_primary_shards\""
          - "\"indices\""
          - "\"_nodes\""
          - "\"mappings\""
          - "\"health\""
          - "\"status\""
          - "\"epoch\""
          - "\"pri\""
          - "\"rep\""
          - "\"docs.count\""

      - type: dsl
        dsl:
          - "contains(tolower(header), 'application/json') || contains(tolower(header), 'application/vnd.elasticsearch')"
          - "len(body) < 52428800"
          - "!contains(tolower(body), 'security_exception')"
          - "!contains(tolower(body), 'unauthorized')"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)\"cluster_name\"\\s*:\\s*\"[^\"]+\""
          - "(?im)\"number_of_nodes\"\\s*:\\s*[0-9]+"
          - "(?im)\"status\"\\s*:\\s*\"(green|yellow|red)\""
          - "(?im)^(green|yellow|red)\\s+open\\s+[a-zA-Z0-9._-]+\\s+[a-zA-Z0-9._-]+"
          - "(?im)\"(index|alias)\"\\s*:\\s*\"[^\"]{0,80}\""
      - type: dsl
        name: status
        dsl:
          - "status_code"
