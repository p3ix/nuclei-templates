id: exposed-env-file-with-secrets

info:
  name: Exposed Environment File With Secrets
  author: p3i
  severity: critical
  description: Detects exposed .env files that contain actual secrets — API keys, tokens, passwords, or database URLs. Requires Content-Type text/plain and confirmed KEY=VALUE pattern with sensitive identifiers to avoid soft-404 false positives.
  tags: exposure,env,secrets,credentials,critical
  metadata:
    max-request: 52

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{env_file}}"

    payloads:
      env_file:
        - ".env"
        - "ai.env"
        - ".env.local"
        - ".env.production"
        - ".env.production.local"
        - ".env.staging"
        - ".env.dev"
        - ".env.development"
        - ".env.test"
        - ".env.backup"
        - ".env.bak"
        - ".env.old"
        - ".env.save"
        - "api/.env"
        - "app/.env"
        - "backend/.env"
        - "config/.env"
        - "src/.env"
        - "web/.env"
        - "frontend/.env"
        - "server/.env"
        - "public/.env"
        - "admin/.env"
        - "docker/.env"
        - "prod/.env"
        - "production/.env"
        - "staging/.env"
        - "current/.env"
        - "html/.env"
        - "laravel/.env"
        - "www/.env"
        - "application/.env"
        - "apps/.env"
        - "client/.env"
        - "core/.env"
        - "new/.env"
        - "old/.env"
        - "release/.env"
        - "test/.env"
        - "v1/.env"
        - "v2/.env"
        - "vendor/.env"
        - "site/.env"
        - "sites/.env"
        - "shop/.env"
        - "store/.env"
        - "portal/.env"
        - "crm/.env"
        - ".env.example"
        - ".env.sample"
        - ".env.template"

    attack: batteringram
    stop-at-first-match: true
    redirects: false
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "content-type: text/html"
        negative: true

      - type: word
        part: body
        words:
          - "<!DOCTYPE"
          - "<html"
          - "<HTML"
          - "Page not found"
          - "page not found"
          - "does not exist"
          - "Object moved"
          - "No encontrado"
          - '<div id="app">'
          - "import-map"
          - "AmazonS3"
        negative: true
        condition: or

      - type: regex
        part: body
        regex:
          - "(?im)^(?:API_KEY|SECRET|TOKEN|PASSWORD|DATABASE_URL|OPENAI_API_KEY|ANTHROPIC_API_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|STRIPE_SECRET_KEY|JWT_SECRET|SECRET_KEY|PRIVATE_KEY|MONGODB_URI|DB_PASSWORD|MYSQL_PASSWORD|POSTGRES_PASSWORD|REDIS_PASSWORD|MAIL_PASSWORD|SMTP_PASSWORD|APP_SECRET|APP_KEY|GOOGLE_API_KEY)\\s*=\\s*\\S+"

      - type: dsl
        dsl:
          - "regex('(?m)^[A-Z_]{3,}\\s*=\\s*\\S+', body)"
          - "len(body) < 524288"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)^(API_KEY|SECRET|TOKEN|PASSWORD|DATABASE_URL|OPENAI_API_KEY|ANTHROPIC_API_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|STRIPE_SECRET_KEY|JWT_SECRET|SECRET_KEY|PRIVATE_KEY|MONGODB_URI|DB_PASSWORD|APP_KEY|APP_SECRET|GOOGLE_API_KEY)\\s*=\\s*[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
