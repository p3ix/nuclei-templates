id: exposed-edge-platform-configs

info:
  name: Exposed Edge Platform And Modern PaaS Configuration
  author: p3i
  severity: medium
  description: Detects exposed Netlify, Vercel, Render, Fly.io, Railway, Cloudflare Workers, Pages, and edge deployment configuration files.
  tags: exposure,edge,paas,netlify,vercel,render,fly,railway,cloudflare
  metadata:
    max-request: 86

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{edge_file}}"

    payloads:
      edge_file:
        - "netlify.toml"
        - "netlify.json"
        - ".netlify/state.json"
        - ".netlify/config.json"
        - "vercel.json"
        - ".vercel/project.json"
        - ".vercel/output/config.json"
        - ".vercel/output/functions/index.func/.vc-config.json"
        - "render.yaml"
        - "render.yml"
        - "fly.toml"
        - "fly.yml"
        - "fly.yaml"
        - "railway.toml"
        - "railway.json"
        - ".railway/config.json"
        - "wrangler.toml"
        - "wrangler.json"
        - "wrangler.jsonc"
        - "worker.toml"
        - "worker.js"
        - "workers-site/index.js"
        - ".wrangler/state/v3/d1/miniflare-D1DatabaseObject"
        - ".dev.vars"
        - ".dev.vars.example"
        - "pages.toml"
        - "cloudflare-pages.toml"
        - "cloudflare.json"
        - "cloudflare.yml"
        - "cloudflare.yaml"
        - "sst.config.ts"
        - "sst.config.js"
        - "amplify.yml"
        - "amplify.yaml"
        - "apphosting.yaml"
        - "apphosting.yml"
        - "app.yaml"
        - "dispatch.yaml"
        - "cron.yaml"
        - "config/netlify.toml"
        - "config/vercel.json"
        - "config/render.yaml"
        - "config/fly.toml"
        - "config/railway.toml"
        - "config/wrangler.toml"
        - "deploy/netlify.toml"
        - "deploy/vercel.json"
        - "deploy/render.yaml"
        - "deploy/fly.toml"
        - "deploy/railway.toml"
        - "deploy/wrangler.toml"
        - "infra/netlify.toml"
        - "infra/vercel.json"
        - "infra/render.yaml"
        - "infra/fly.toml"
        - "infra/railway.toml"
        - "infra/wrangler.toml"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "[build]"
          - "[context.production]"
          - "[functions]"
          - "[[redirects]]"
          - "NETLIFY"
          - "\"version\": 2"
          - "\"builds\""
          - "render.com"
          - "envVars:"
          - "primary_region"
          - "RAILWAY_"
          - "wrangler"
          - "compatibility_date"
          - "account_id"
          - "kv_namespaces"
          - "d1_databases"
          - "r2_buckets"
          - "durable_objects"
          - "[vars]"
          - "CLOUDFLARE_API_TOKEN"
          - "amplify"
          - "apphosting"

      - type: regex
        part: body
        condition: or
        regex:
          - "(?im)^\\[build\\]"
          - "(?im)^\\[context\\.(production|deploy-preview|branch-deploy)\\]"
          - "(?im)^\\[\\[redirects\\]\\]"
          - "(?im)\"(version|routes|builds|rewrites|env)\"\\s*:"
          - "(?im)^services:\\s*$"
          - "(?im)^\\s+-\\s+type:\\s+web\\b"
          - "(?im)^app\\s*=\\s*\"[^\"]+\""
          - "(?im)^primary_region\\s*=\\s*\"[a-z0-9-]+\""
          - "(?im)^compatibility_date\\s*=\\s*\"[0-9]{4}-[0-9]{2}-[0-9]{2}\""
          - "(?im)^name\\s*=\\s*\"[^\"]+\"\\s*$"

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "!contains(tolower(body), '<!doctype')"
          - "len(body) < 20971520"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(account_id|zone_id|projectId|orgId|teamId|site_id|primary_region|compatibility_date|kv_namespaces|d1_databases|r2_buckets|envVars|CLOUDFLARE_API_TOKEN|RAILWAY_[A-Z_]+)[\"'\\s:=]+[^\\r\\n,;<>]+"
          - "(?im)(SECRET|TOKEN|PASSWORD|DATABASE_URL|API_KEY|AUTH|DSN)[\"'\\s:=]+[^\\r\\n,;<>]+"
