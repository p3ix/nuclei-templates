id: exposed-config-secrets

info:
  name: Exposed Configuration Files With Secrets
  author: p3i
  severity: high
  description: Detects exposed application configuration files that commonly contain credentials, tokens, database URLs, or private runtime settings.
  tags: exposure,files,config,secrets
  metadata:
    max-request: 106

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuclei-fp-check-{{randstr}}-notexist"
    redirects: false
    matchers:
      - type: dsl
        internal: true
        dsl:
          - "status_code != 200"

  - method: GET
    path:
      - "{{BaseURL}}/{{config_file}}"

    payloads:
      config_file:
        - "config.php"
        - "config.inc.php"
        - "config.ini"
        - "config.json"
        - "config.yaml"
        - "config.yml"
        - "settings.php"
        - "settings.ini"
        - "settings.json"
        - "settings.yaml"
        - "application.properties"
        - "application.yml"
        - "application.yaml"
        - "appsettings.json"
        - "appsettings.Development.json"
        - "appsettings.Production.json"
        - "connectionstrings.config"
        - "connections.config"
        - "database.php"
        - "database.yml"
        - "database.yaml"
        - "database.json"
        - "db.php"
        - "db.ini"
        - "db.json"
        - "localsettings.php"
        - "local_settings.py"
        - "settings.py"
        - "production.py"
        - "development.py"
        - "parameters.yml"
        - "parameters.yaml"
        - "parameters.ini"
        - "secrets.json"
        - "secrets.yml"
        - "secrets.yaml"
        - "credentials.json"
        - "credentials.yml"
        - "credentials.yaml"
        - "wp-config.php"
        - "wp-config.php.bak"
        - "wp-config.php.old"
        - "wp-config.php.save"
        - "wp-config.php~"
        - "web.config"
        - "Web.config"
        - "config/config.php"
        - "config/config.ini"
        - "config/config.json"
        - "config/config.yml"
        - "config/settings.php"
        - "config/settings.ini"
        - "config/database.php"
        - "config/database.yml"
        - "config/secrets.yml"
        - "config/credentials.yml"
        - "config/master.key"
        - "app/config/config.php"
        - "app/config/database.php"
        - "app/config/parameters.yml"
        - "application/config/config.php"
        - "application/config/database.php"
        - "includes/config.php"
        - "sites/default/settings.php"
        - "terraform.tfvars"
        - "terraform.tfvars.json"
        - ".terraform.tfvars"
        - "terraform.tfstate"
        - ".vault-token"
        - "vault.json"
        - "consul.json"
        - "docker-compose.override.yml"
        - "docker-compose.prod.yml"
        - "docker-compose.production.yml"
        - ".kube/config"
        - "kubeconfig"
        - "kubeconfig.yaml"
        - ".npmrc"
        - ".pypirc"
        - ".gradle/gradle.properties"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "DB_PASSWORD"
          - "DATABASE_URL"
          - "password:"
          - "\"password\""
          - "'password'"
          - "secret_key"
          - "SECRET_KEY"
          - "api_key"
          - "API_KEY"
          - "access_key"
          - "client_secret"
          - "PRIVATE KEY"
          - "BEGIN RSA PRIVATE KEY"
          - "BEGIN OPENSSH PRIVATE KEY"
          - "connectionString"
          - "ConnectionStrings"
          - "mysql:host"
          - "mongodb://"
          - "postgres://"
          - "redis://"
          - "define('DB_PASSWORD'"
          - "define( 'DB_PASSWORD'"
          - "vault_token"
          - "VAULT_TOKEN"
          - "AWS_SECRET_ACCESS_KEY"
          - "aws_secret_access_key"
          - "KUBECONFIG"
          - "_auth_token"
          - "registry-token"

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "!contains(tolower(body), '<!doctype')"
          - "!contains(body, '__NEXT_DATA__') && !contains(body, 'react-root') && !contains(body, 'window.__') && !contains(body, 'var $_ENV')"
          - "!contains(tolower(body), 'wp-content') && !contains(tolower(body), 'wp-includes') && !contains(tolower(body), 'wp-admin') && !contains(tolower(body), 'woocommerce') && !contains(tolower(body), 'wpemoji') && !contains(tolower(body), 'gravityforms') && !contains(tolower(body), 'wpml')"
          - "!contains(tolower(body), 'data-astro-cid') && !contains(tolower(body), '_astro/') && !contains(tolower(body), '__nuxt') && !contains(tolower(body), 'ng-version') && !contains(tolower(body), 'data-reactroot') && !contains(tolower(body), 'rails-ujs')"
          - "len(body) < 1048576"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(password|secret|api[_-]?key|access[_-]?key|connectionstring|database_url)[\"'\\s:=]+[^\\r\\n,;]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
