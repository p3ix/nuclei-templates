id: exposed-openobserve-api

info:
  name: Exposed OpenObserve Log Analytics Platform Without Authentication
  author: p3i
  severity: high
  description: >
    Detects OpenObserve (open-source cloud-native observability platform,
    alternative to Elasticsearch + Kibana) instances with the API accessible
    without authentication. OpenObserve stores logs, metrics, and traces from
    applications — these may contain: application error logs with stack traces
    and internal system paths, API request/response logs with authentication
    tokens and user data, database query logs, security event logs, and
    infrastructure metrics. When the API is accessible without credentials,
    an attacker can: list all organizations and streams (log indexes), query
    any log stream and extract historical application logs, access dashboards
    and alerts configuration, and enumerate all ingestion endpoints. OpenObserve
    uses root@example.com/Complexpass#123 as documented default credentials.
  reference:
    - https://openobserve.ai/docs/quickstart/
    - https://github.com/openobserve/openobserve
  tags: exposure,openobserve,logging,analytics,observability,logs,credentials
  metadata:
    max-request: 6

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/default/streams"
      - "{{BaseURL}}/api/default/dashboards"
      - "{{BaseURL}}/api/default/alerts"
      - "{{BaseURL}}/api/organizations"
      - "{{BaseURL}}/healthz"
      - "{{BaseURL}}/api/default/_search"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"openobserve_version\":"
          - "\"stream_type\":"
          - "\"settings\":"
          - "\"stats\":"
          - "\"dashboard_id\":"
          - "\"org_id\":"
          - "\"ingest_docs_per_second\":"
          - "\"storage_type\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'openobserve_version') ||
            contains(body, 'ingest_docs_per_second') ||
            (contains(body, 'stream_type') && contains(body, 'stats')) ||
            (contains(body, 'dashboard_id') && contains(body, 'org_id')) ||
            (contains(body, 'settings') && contains(body, 'storage_type'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(openobserve_version|stream_type|org_id|name|storage_type)"\s*:\s*"?[^",}{]{1,120}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
