id: exposed-redash-api

info:
  name: Exposed Redash Data Visualization API Without Authentication
  author: p3i
  severity: high
  description: >
    Detects Redash (open-source BI and data visualization platform) instances
    with the API accessible without authentication. Redash connects to databases
    and external APIs to run queries and build dashboards. Each configured "data
    source" stores complete connection credentials including database host, port,
    username, password, and SSL certificates for PostgreSQL, MySQL, BigQuery,
    Athena, Elasticsearch, and more. When the Redash API is accessible without
    an API key or session cookie, an attacker can: list all configured data sources
    and their connection details, enumerate all saved queries revealing database
    schema and business logic, access query results which may contain sensitive
    records, and list all users and their API keys.
  reference:
    - https://redash.io/help/open-source/setup
    - https://redash.io/help/user-guide/users/api-key-authentication
  tags: exposure,redash,bi,analytics,database,credentials,dashboard,visualization
  metadata:
    max-request: 8

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/data_sources"
      - "{{BaseURL}}/api/queries?page=1&page_size=5"
      - "{{BaseURL}}/api/dashboards?page=1&page_size=5"
      - "{{BaseURL}}/api/session"
      - "{{BaseURL}}/api/settings/organization"
      - "{{BaseURL}}/api/users?page=1&page_size=5"
      - "{{BaseURL}}/redash/api/data_sources"
      - "{{BaseURL}}/api/data_sources/1/schema"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"data_source_id\":"
          - "\"query_hash\":"
          - "\"data_source_type\":"
          - "\"redash_version\":"
          - "\"schedule_enabled\":"
          - "\"options_updated\":"
          - "\"view_only\":"
          - "\"can_edit\":"
          - "\"queue_name\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'redash_version') ||
            contains(body, 'query_hash') ||
            contains(body, 'data_source_type') ||
            contains(body, 'schedule_enabled') ||
            (contains(body, 'data_source_id') && contains(body, 'can_edit')) ||
            (contains(body, 'view_only') && contains(body, 'queue_name'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(redash_version|data_source_type|name|id|syntax)"\s*:\s*"?[^",}{]{1,120}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
