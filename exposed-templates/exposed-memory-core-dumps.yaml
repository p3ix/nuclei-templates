id: exposed-memory-core-dumps

info:
  name: Exposed Memory Dumps And Core Files
  author: p3i
  severity: high
  description: Detects exposed memory dumps, crash dumps, minidumps, and core files that can contain process memory, credentials, tokens, source paths, and runtime secrets.
  tags: exposure,memory,dump,core,crash,minidump
  metadata:
    max-request: 86

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{memory_file}}"

    payloads:
      memory_file:
        - "core"
        - "core.0"
        - "core.1"
        - "core.1234"
        - "core.dump"
        - "core.dmp"
        - "core.gz"
        - "core.tar.gz"
        - "app.dmp"
        - "application.dmp"
        - "server.dmp"
        - "process.dmp"
        - "memory.dmp"
        - "memdump.dmp"
        - "crash.dmp"
        - "minidump.dmp"
        - "dump.dmp"
        - "app.dump"
        - "application.dump"
        - "server.dump"
        - "memory.dump"
        - "memdump"
        - "memory.dump.gz"
        - "crash.dump"
        - "crashdump"
        - "crashdump.dmp"
        - "crashdump.zip"
        - "minidump"
        - "minidump.zip"
        - "minidumps/"
        - "crash-reports/"
        - "crash_reports/"
        - "crashes/"
        - "dumps/core"
        - "dumps/core.1234"
        - "dumps/app.dmp"
        - "dumps/memory.dmp"
        - "dump/core"
        - "dump/memory.dmp"
        - "tmp/core"
        - "tmp/core.1234"
        - "tmp/app.dmp"
        - "tmp/memory.dmp"
        - "var/core"
        - "var/crash/core"
        - "var/crash/app.dmp"
        - "logs/crash.dmp"
        - "logs/minidump.dmp"
        - "debug/core"
        - "debug/app.dmp"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        condition: or
        dsl:
          - "contains(body, 'ELF')"
          - "contains(body, 'MDMP')"
          - "contains(body, 'MiniDump')"
          - "contains(body, 'Core was generated by')"
          - "contains(body, 'Program terminated with signal')"
          - "contains(body, 'GNU gdb')"
          - "contains(body, 'Microsoft C/C++ MSF')"
          - "contains(tolower(header), 'application/octet-stream') && len(body) > 1024"
          - "contains(tolower(header), 'application/x-core')"
          - "contains(tolower(header), 'application/x-dmp')"
          - "contains(tolower(header), 'filename=')"

      - type: dsl
        dsl:
          - "len(body) > 128"
          - "len(body) < 314572800"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(Core was generated by|Program terminated with signal|MiniDump|GNU gdb|ELF).{0,180}"
          - "(?im)(password|secret|token|api[_-]?key|authorization|database_url|AWS_SECRET_ACCESS_KEY|PRIVATE KEY).{0,180}"
      - type: regex
        part: header
        regex:
          - "(?i)(content-type|content-length|content-disposition): [^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
