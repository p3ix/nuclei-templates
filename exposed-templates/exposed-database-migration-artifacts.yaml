id: exposed-database-migration-artifacts

info:
  name: Exposed Database Migration Artifacts
  author: p3i
  severity: medium
  description: Detects exposed database migration files and schema artifacts from Flyway, Liquibase, Prisma, Rails, Django, Alembic, Knex, TypeORM, Sequelize, and similar tooling that can reveal tables, columns, internal data model, seed data, and sometimes credentials.
  tags: exposure,database,migrations,schema,prisma,liquibase,flyway
  metadata:
    max-request: 76

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{migration_file}}"

    payloads:
      migration_file:
        - "prisma/schema.prisma"
        - "schema.prisma"
        - "db/schema.rb"
        - "db/structure.sql"
        - "db/seeds.rb"
        - "database/schema.sql"
        - "database/structure.sql"
        - "database/seeds.sql"
        - "migrations/schema.sql"
        - "migrations/001_initial.sql"
        - "migrations/001_init.sql"
        - "migrations/0001_initial.py"
        - "db/migrate/001_create_users.rb"
        - "db/migrate/001_initial.rb"
        - "db/migrations/001_initial.sql"
        - "database/migrations/001_initial.sql"
        - "database/migrations/0001_initial.py"
        - "alembic.ini"
        - "alembic/env.py"
        - "alembic/versions/0001_initial.py"
        - "migrations/env.py"
        - "migrations/versions/0001_initial.py"
        - "liquibase.properties"
        - "changelog.xml"
        - "db/changelog.xml"
        - "database/changelog.xml"
        - "db/changelog/db.changelog-master.xml"
        - "src/main/resources/db/changelog/db.changelog-master.xml"
        - "flyway.conf"
        - "conf/flyway.conf"
        - "sql/V1__init.sql"
        - "db/migration/V1__init.sql"
        - "src/main/resources/db/migration/V1__init.sql"
        - "knexfile.js"
        - "knexfile.ts"
        - "ormconfig.json"
        - "ormconfig.js"
        - "sequelize.config.js"
        - "config/config.json"
        - "typeorm.config.ts"
        - "mikro-orm.config.ts"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        condition: or
        regex:
          - "(?im)^\\s*(CREATE|ALTER|DROP)\\s+(TABLE|INDEX|SEQUENCE|VIEW)\\b"
          - "(?i)<databaseChangeLog\\b|<changeSet\\b"
          - "(?im)^\\s*model\\s+[A-Z][A-Za-z0-9_]+\\s*\\{"
          - "(?im)^\\s*create_table\\s+[:'\"]"
          - "(?im)^\\s*class\\s+Migration\\("
          - "(?i)op\\.create_table\\(|alembic\\.context|sqlalchemy\\.url"
          - "(?im)^\\s*exports\\.(up|down)\\s*=|new\\s+Sequelize\\(|DataTypes\\."
          - "(?i)flyway\\.(url|user|password|locations)"

      - type: regex
        part: body
        condition: or
        regex:
          - "(?i)\\b(users|accounts|sessions|tokens|password|email|api_keys|oauth|billing|payments|orders)\\b"
          - "(?i)\\b(primary key|foreign key|unique index|create index|varchar|uuid|timestamp|jsonb)\\b"
          - "(?i)(database_url|jdbc:|postgres://|mysql://|mongodb://)"

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "!contains(tolower(body), '<!doctype')"
          - "len(body) < 10485760"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)^\\s*(CREATE|ALTER)\\s+TABLE\\s+[^\\r\\n;]+"
          - "(?im)^\\s*model\\s+[A-Z][A-Za-z0-9_]+"
          - "(?im)(password|token|secret|database_url|jdbc:|postgres://|mysql://).{0,160}"
      - type: dsl
        name: status
        dsl:
          - "status_code"
