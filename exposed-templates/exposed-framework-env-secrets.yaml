id: exposed-framework-env-secrets

info:
  name: Exposed Framework Environment And Secret Key Files
  author: p3i
  severity: high
  description: Detects exposed environment variants and framework secret files such as secrets.yml, credentials.yml.enc, Rails master.key, Laravel .env files, and common secret configuration files.
  tags: exposure,secrets,env,rails,laravel,framework,config
  metadata:
    max-request: 112

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{secret_file}}"

    payloads:
      secret_file:
        - ".env"
        - ".env.local"
        - ".env.development"
        - ".env.dev"
        - ".env.production"
        - ".env.prod"
        - ".env.staging"
        - ".env.stage"
        - ".env.test"
        - ".env.testing"
        - ".env.backup"
        - ".env.bak"
        - ".env.old"
        - ".env.save"
        - ".env.tmp"
        - ".env.orig"
        - ".env.production.local"
        - ".env.staging.local"
        - ".env.local.bak"
        - ".env.production.bak"
        - ".env.staging.bak"
        - "env.local"
        - "env.production"
        - "env.staging"
        - "config/.env"
        - "app/.env"
        - "api/.env"
        - "backend/.env"
        - "frontend/.env"
        - "public/.env"
        - "server/.env"
        - "src/.env"
        - "web/.env"
        - "www/.env"
        - "config/secrets.yml"
        - "config/secrets.yaml"
        - "secrets.yml"
        - "secrets.yaml"
        - "secrets.json"
        - "secret.yml"
        - "secret.yaml"
        - "secret.json"
        - "config/credentials.yml"
        - "config/credentials.yaml"
        - "credentials.yml"
        - "credentials.yaml"
        - "credentials.json"
        - "config/credentials.yml.enc"
        - "config/credentials/production.yml.enc"
        - "config/credentials/staging.yml.enc"
        - "config/credentials/development.yml.enc"
        - "credentials.yml.enc"
        - "production.yml.enc"
        - "staging.yml.enc"
        - "development.yml.enc"
        - "config/master.key"
        - "master.key"
        - "config/initializers/devise.rb"
        - "config/application.yml"
        - "config/application.yaml"
        - "application.yml"
        - "application.yaml"
        - "config/database.yml"
        - "database.yml"
        - "config/cable.yml"
        - "cable.yml"
        - "config/storage.yml"
        - "storage.yml"
        - "config/spring.rb"
        - "bootstrap/cache/config.php"
        - "config/app.php"
        - "config/services.php"
        - "config/jwt.php"
        - "config/auth.php"
        - "config/session.php"
        - "config/mail.php"
        - "config/database.php"
        - "appsettings.Secrets.json"
        - "appsettings.Local.json"
        - "appsettings.Development.json"
        - "appsettings.Production.json"
        - "appsettings.Staging.json"
        - "local_settings.py"
        - "settings_local.py"
        - "settings/production.py"
        - "settings/staging.py"
        - "settings/local.py"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "APP_KEY="
          - "APP_SECRET="
          - "APP_ENV="
          - "DB_PASSWORD="
          - "DATABASE_URL="
          - "SECRET_KEY="
          - "SECRET_KEY_BASE"
          - "secret_key_base"
          - "RAILS_MASTER_KEY"
          - "master.key"
          - "credentials.yml.enc"
          - "AWS_SECRET_ACCESS_KEY"
          - "JWT_SECRET"
          - "DEVISE_SECRET_KEY"
          - "devise.secret_key"
          - "encrypted:"
          - "production:"
          - "staging:"
          - "development:"
          - "adapter:"
          - "username:"
          - "password:"
          - "\"ConnectionStrings\""
          - "\"DefaultConnection\""
          - "MONGODB_URI"
          - "REDIS_URL"
          - "MAIL_PASSWORD"

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(body), '<!doctype')"
          - "len(body) > 16"
          - "len(body) < 10485760"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(APP_KEY|APP_SECRET|DB_PASSWORD|DATABASE_URL|SECRET_KEY|SECRET_KEY_BASE|secret_key_base|RAILS_MASTER_KEY|AWS_SECRET_ACCESS_KEY|JWT_SECRET|DEVISE_SECRET_KEY|MONGODB_URI|REDIS_URL|MAIL_PASSWORD)[\"'\\s:=]+[^\\r\\n,;]+"
          - "(?im)(username|password|adapter|host|database|ConnectionStrings|DefaultConnection)[\"'\\s:=<>]+[^\\r\\n,;<>]+"

