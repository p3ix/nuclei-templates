id: exposed-mattermost-api

info:
  name: Exposed Mattermost API With User Enumeration or Data Access
  author: p3i
  severity: high
  description: >
    Detects Mattermost (open-source team messaging platform) instances where
    the API exposes sensitive data without proper authentication or with user
    enumeration vulnerabilities. Mattermost stores all team communications
    including: direct messages, channel history, file attachments, and integrations
    with credentials (webhook URLs, bot tokens, OAuth apps). When the API is
    accessible, an attacker can: enumerate all users (GET /api/v4/users reveals
    email addresses, usernames, and profile data), list all public channels and
    teams, access the system console if admin credentials are weak, and in older
    versions exploit user enumeration via the login endpoint timing differences.
    The /api/v4/config endpoint may expose the full system configuration including
    database connection strings if accessible to admin accounts.
  reference:
    - https://docs.mattermost.com/about/security.html
    - https://docs.mattermost.com/developer/web-service-api.html
  tags: exposure,mattermost,messaging,team,chat,users,enumeration
  metadata:
    max-request: 7

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v4/users?per_page=5"
      - "{{BaseURL}}/api/v4/teams?per_page=5"
      - "{{BaseURL}}/api/v4/system/ping"
      - "{{BaseURL}}/api/v4/config/client?format=old"
      - "{{BaseURL}}/api/v4/channels?per_page=5"
      - "{{BaseURL}}/api/v4/license/client"
      - "{{BaseURL}}/api/v4/system/server_version"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"MattermostVersion\":"
          - "\"BuildDate\":"
          - "\"BuildHash\":"
          - "\"SiteURL\":"
          - "\"EnableUserCreation\":"
          - "\"EnableSignUpWithEmail\":"
          - "\"ServiceSettings.SiteURL\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'MattermostVersion') ||
            contains(body, 'BuildHash') ||
            contains(body, 'EnableUserCreation') ||
            contains(body, 'EnableSignUpWithEmail') ||
            (contains(body, 'SiteURL') && contains(body, 'BuildDate'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(MattermostVersion|BuildDate|SiteURL|Edition)"\s*:\s*"?[^",}{]{1,200}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
