id: exposed-monitoring-dashboards

info:
  name: Exposed Monitoring Dashboards And Observability Consoles
  author: p3i
  severity: medium
  description: Detects exposed monitoring, metrics, tracing, logging, uptime, and observability dashboards or endpoints.
  tags: exposure,monitoring,metrics,dashboard,grafana,prometheus,observability
  metadata:
    max-request: 92

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{monitor_path}}"

    payloads:
      monitor_path:
        - "grafana/"
        - "grafana/login"
        - "prometheus/"
        - "prometheus/targets"
        - "prometheus/graph"
        - "metrics"
        - "metrics/"
        - "federate"
        - "alertmanager/"
        - "alertmanager/#/alerts"
        - "kibana/"
        - "app/kibana"
        - "app/home"
        - "elasticsearch/"
        - "opensearch/"
        - "_dashboards/"
        - "jaeger/"
        - "jaeger/search"
        - "zipkin/"
        - "zipkin/"
        - "tracing/"
        - "traces/"
        - "loki/"
        - "loki/api/v1/labels"
        - "graylog/"
        - "splunk/"
        - "zabbix/"
        - "nagios/"
        - "icingaweb2/"
        - "munin/"
        - "netdata/"
        - "server-status"
        - "server-status?auto"
        - "server-info"
        - "status"
        - "status/"
        - "health"
        - "health/"
        - "ready"
        - "readyz"
        - "live"
        - "livez"
        - "debug/metrics"
        - "debug/vars"
        - "debug/pprof"
        - "stats"
        - "stats/"
        - "haproxy?stats"
        - "nginx_status"
        - "stub_status"
        - "traefik/"
        - "dashboard/"
        - "dashboard/#/"
        - "consul/"
        - "consul/ui/"
        - "nomad/"
        - "nomad/ui/"
        - "vault/"
        - "vault/ui/"

    attack: batteringram
    redirects: false
    max-redirects: 3
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Require structural/data indicators, not bare tool names — "Grafana", "Prometheus",
      # "Kibana" etc. appear on documentation pages, blog posts, and any SaaS landing page.
      - type: word
        part: body
        condition: or
        words:
          # Prometheus/metrics: exposition format or internal metric names
          - "# HELP"
          - "# TYPE"
          - "go_gc_duration_seconds"
          - "process_cpu_seconds_total"
          - "prometheus_build_info"
          # Grafana: structural JS markers only
          - "grafana-app"
          - "GrafanaBootData"
          - "grafana_session"
          - "\"isStarred\""
          # Apache/nginx status
          - "Apache Server Status"
          - "Active connections:"
          - "server accepts handled requests"
          # Traefik: config-specific terms
          - "traefik_entrypoint"
          - "traefik_backend"
          - "\"routers\":"
          # Kibana/OpenSearch: structural JSON
          - "\"kibana.version\""
          - "\"OpenSearch Dashboards\""
          # Loki: label API response
          - "\"data\":{\"type\":\"success\""
          # Jaeger: trace data
          - "\"traceID\""
          - "\"spanID\""
          # Zabbix: specific API structure
          - "\"zabbix.version\""
          # Alertmanager: receiver data
          - "\"alertname\""
          - "\"receivers\":"
          # Consul/Nomad/Vault: API JSON fields
          - "\"KnownLeader\""
          - "\"EvalID\""
          - "\"SecretID\""

      - type: dsl
        dsl:
          # Monitoring endpoints return JSON, plain text metrics, or clean HTML — not CMS pages
          - "!contains(tolower(body), 'wp-content') && !contains(tolower(body), 'wp-includes') && !contains(tolower(body), 'wp-admin') && !contains(tolower(body), 'woocommerce') && !contains(tolower(body), 'wpemoji')"
          - "!contains(tolower(body), 'data-astro-cid') && !contains(tolower(body), '_astro/') && !contains(tolower(body), '__nuxt') && !contains(tolower(body), 'ng-version') && !contains(tolower(body), 'data-reactroot')"
          - "len(body) < 52428800"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)(Grafana|Prometheus|Alertmanager|Kibana|Jaeger|Zipkin|Zabbix|Nagios|Netdata|Consul|Nomad|Vault)[^\\r\\n<]{0,120}"
          - "(?im)^#\\s+(HELP|TYPE)\\s+[a-zA-Z_:][a-zA-Z0-9_:]*.*$"
      - type: dsl
        name: status
        dsl:
          - "status_code"
