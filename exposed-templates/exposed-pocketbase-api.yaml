id: exposed-pocketbase-api

info:
  name: Exposed PocketBase Backend-as-a-Service Without Authentication
  author: p3i
  severity: high
  description: >
    Detects PocketBase (open-source backend-as-a-service in a single file)
    instances with the admin API or data accessible without proper authentication.
    PocketBase is increasingly popular for startup MVPs and side projects — it
    provides a SQLite database backend, file storage, user authentication, and
    a REST API, all in a single Go binary. When the admin UI and API are exposed:
    the /api/collections endpoint lists all database collections and their schemas,
    the /api/admins endpoint can enumerate admin accounts, and misconfigured
    collection rules may allow unauthenticated access to records. PocketBase also
    ships with an admin dashboard on /_/ which should never be publicly accessible.
    Exposed PocketBase instances often contain startup user data, early customer
    records, and application configuration.
  reference:
    - https://pocketbase.io/docs/api-records/
    - https://github.com/pocketbase/pocketbase
  tags: exposure,pocketbase,baas,database,api,sqlite,startup
  metadata:
    max-request: 7

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/collections?perPage=5"
      - "{{BaseURL}}/api/health"
      - "{{BaseURL}}/api/settings"
      - "{{BaseURL}}/api/admins?perPage=5"
      - "{{BaseURL}}/api/logs?perPage=5"
      - "{{BaseURL}}/_/"
      - "{{BaseURL}}/api/files"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"pocketbase_version\":"
          - "\"schemaFields\":"
          - "\"listRule\":"
          - "\"viewRule\":"
          - "\"createRule\":"
          - "\"updateRule\":"
          - "\"deleteRule\":"
          - "\"collectionId\":"
          - "\"totalItems\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'pocketbase_version') ||
            contains(body, 'schemaFields') ||
            (contains(body, 'listRule') && contains(body, 'viewRule')) ||
            (contains(body, 'collectionId') && contains(body, 'totalItems')) ||
            (contains(body, 'createRule') && contains(body, 'deleteRule'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(pocketbase_version|name|collectionId|type)"\s*:\s*"?[^",}{]{1,120}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
