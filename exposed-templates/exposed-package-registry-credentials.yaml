id: exposed-package-registry-credentials

info:
  name: Exposed Package Registry And Build Tool Credentials
  author: p3i
  severity: high
  description: Detects exposed package manager, build tool, and artifact registry credential files such as .npmrc, .pypirc, RubyGems credentials, Maven settings.xml, and Gradle properties.
  tags: exposure,secrets,package-manager,npm,pypi,rubygems,maven,gradle
  metadata:
    max-request: 92

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{registry_file}}"

    payloads:
      registry_file:
        - ".npmrc"
        - ".npmrc.bak"
        - ".npmrc.old"
        - ".npmrc.save"
        - ".npmrc.tmp"
        - ".npmrc~"
        - "npmrc"
        - "config/.npmrc"
        - "app/.npmrc"
        - "src/.npmrc"
        - "frontend/.npmrc"
        - "backend/.npmrc"
        - ".yarnrc"
        - ".yarnrc.yml"
        - ".yarnrc.yaml"
        - ".pnpmrc"
        - ".pypirc"
        - ".pypirc.bak"
        - ".pypirc.old"
        - ".pypirc.save"
        - ".pypirc.tmp"
        - ".pypirc~"
        - "pypirc"
        - "config/.pypirc"
        - ".gem/credentials"
        - ".gem/credentials.bak"
        - ".gem/credentials.old"
        - "gem/credentials"
        - ".gemrc"
        - "gemrc"
        - ".m2/settings.xml"
        - "settings.xml"
        - "maven/settings.xml"
        - "config/settings.xml"
        - "build/settings.xml"
        - "settings-security.xml"
        - ".m2/settings-security.xml"
        - "gradle.properties"
        - "gradle-local.properties"
        - "local.properties"
        - "config/gradle.properties"
        - "android/gradle.properties"
        - "android/local.properties"
        - "app/gradle.properties"
        - "build.gradle"
        - "build.gradle.kts"
        - "gradle/wrapper/gradle-wrapper.properties"
        - "sbt.boot.properties"
        - ".sbt/1.0/global.sbt"
        - ".ivy2/.credentials"
        - "ivysettings.xml"
        - ".cargo/credentials"
        - ".cargo/credentials.toml"
        - "cargo/credentials"
        - "pip.conf"
        - ".pip/pip.conf"
        - "pip/pip.conf"
        - "pip.ini"
        - ".config/pip/pip.conf"
        - "nuget.config"
        - "NuGet.config"
        - ".nuget/NuGet/NuGet.Config"
        - "composer/auth.json"
        - "auth.json"
        - "composer.json"
        - "composer.lock"
        - ".netrc"
        - "_netrc"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "_authToken"
          - "_auth="
          - "always-auth"
          - "npm.pkg.github.com"
          - "registry.npmjs.org"
          - "npmAuthToken"
          - "npmRegistries"
          - "[pypi]"
          - "pypi-token"
          - "__token__"
          - "password:"
          - "username:"
          - ":rubygems_api_key:"
          - "rubygems_api_key"
          - "<settings"
          - "<servers>"
          - "<server>"
          - "<username>"
          - "<password>"
          - "<privateKey>"
          - "systemProp."
          - "signing.keyId"
          - "signing.password"
          - "mavenPassword"
          - "mavenUser"
          - "gpr.key"
          - "ossrhPassword"
          - "sonatypePassword"
          - "cargo-registry-token"
          - "index-url"
          - "extra-index-url"
          - "api.nuget.org"
          - "github-oauth"
          - "http-basic"
          - "machine "
          - "login "

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "!contains(tolower(body), '<!doctype')"
          - "len(body) < 10485760"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(_authToken|npmAuthToken|_auth|password|username|rubygems_api_key|pypi-token|token|privateKey|signing\\.password|mavenPassword|gpr\\.key|ossrhPassword|sonatypePassword|cargo-registry-token)[\"'\\s:=<>/-]+[^\\r\\n,;<>]+"
          - "(?im)(registry|index-url|extra-index-url|machine|login)[\"'\\s:=]+[^\\r\\n,;<>]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
