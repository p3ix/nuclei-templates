id: exposed-grafana-access

info:
  name: Exposed Grafana Login Or Anonymous Access
  author: p3i
  severity: medium
  description: Detects exposed Grafana instances, login pages, anonymous dashboards, and public API responses. This template does not attempt default credentials.
  tags: exposure,grafana,monitoring,dashboard,anonymous
  metadata:
    max-request: 58

http:
  - method: GET
    path:
      - "{{BaseURL}}/grafana/"
      - "{{BaseURL}}/grafana/login"
      - "{{BaseURL}}/grafana/api/health"
      - "{{BaseURL}}/grafana/api/org"
      - "{{BaseURL}}/grafana/api/search"
      - "{{BaseURL}}/grafana/dashboards"
      - "{{BaseURL}}/grafana/dashboards/home"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/api/health"
      - "{{BaseURL}}/api/org"
      - "{{BaseURL}}/api/search"
      - "{{BaseURL}}/dashboards"
      - "{{BaseURL}}/dashboards/home"
      - "{{BaseURL}}/d/"
      - "{{BaseURL}}/public-dashboards/"
      - "{{BaseURL}}/dashboard/snapshot/"
      - "{{BaseURL}}/grafana/public-dashboards/"
      - "{{BaseURL}}/grafana/dashboard/snapshot/"

    redirects: false
    max-redirects: 3
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Require Grafana-specific structural indicators — "Grafana" alone appears in blog
      # posts, docs, and any page that mentions the product.
      - type: word
        part: body
        condition: or
        words:
          - "grafana-app"
          - "\"orgId\""
          - "\"type\":\"dash-db\""
          - "\"isStarred\""
          - "public-dashboards"
          - "dashboard-solo"
          - "Welcome to Grafana"
          - "login-subtitle"
          - "GrafanaBootData"
          - "grafana_session"

      - type: dsl
        dsl:
          - "!contains(tolower(body), 'wp-content') && !contains(tolower(body), 'wp-includes') && !contains(tolower(body), 'wp-admin') && !contains(tolower(body), 'woocommerce') && !contains(tolower(body), 'wpemoji') && !contains(tolower(body), 'gravityforms') && !contains(tolower(body), 'wpml')"
          - "!contains(tolower(body), 'data-astro-cid') && !contains(tolower(body), '_astro/') && !contains(tolower(body), '__nuxt') && !contains(tolower(body), 'ng-version') && !contains(tolower(body), 'data-reactroot') && !contains(tolower(body), 'rails-ujs')"
          - "len(body) < 20971520"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)(Grafana|grafana-app|Welcome to Grafana|public-dashboards|dashboard/snapshot)[^\\r\\n<]{0,160}"
          - "(?i)\"(title|uri|url|version|commit|database)\"\\s*:\\s*\"[^\"]+\""
      - type: dsl
        name: status
        dsl:
          - "status_code"
