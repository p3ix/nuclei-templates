id: exposed-backup-artifacts

info:
  name: Exposed Backup And Archive Artifacts
  author: p3i
  severity: high
  description: Detects exposed backup archives, database dumps, compressed source bundles, and rotated copies of sensitive files.
  tags: exposure,backup,archive,dump,source
  metadata:
    max-request: 96

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{backup_file}}"

    payloads:
      backup_file:
        - "backup.zip"
        - "backup.tar"
        - "backup.tar.gz"
        - "backup.tgz"
        - "backup.rar"
        - "backup.7z"
        - "backups.zip"
        - "backups.tar.gz"
        - "site.zip"
        - "site.tar.gz"
        - "website.zip"
        - "website.tar.gz"
        - "www.zip"
        - "www.tar.gz"
        - "html.zip"
        - "html.tar.gz"
        - "public.zip"
        - "public.tar.gz"
        - "web.zip"
        - "web.tar.gz"
        - "app.zip"
        - "app.tar.gz"
        - "src.zip"
        - "src.tar.gz"
        - "source.zip"
        - "source.tar.gz"
        - "code.zip"
        - "code.tar.gz"
        - "dump.sql"
        - "database.sql"
        - "db.sql"
        - "backup.sql"
        - "mysql.sql"
        - "postgres.sql"
        - "data.sql"
        - "dump.sql.gz"
        - "database.sql.gz"
        - "db.sql.gz"
        - "backup.sql.gz"
        - "dump.gz"
        - "db.dump"
        - "database.dump"
        - "backup.dump"
        - "db.bak"
        - "database.bak"
        - "backup.bak"
        - "config.php.bak"
        - "config.php.old"
        - "config.php.save"
        - "config.php~"
        - "settings.php.bak"
        - "settings.php.old"
        - "web.config.bak"
        - "web.config.old"
        - "appsettings.json.bak"
        - ".env.bak"
        - ".env.old"
        - ".env.save"
        - "admin.zip"
        - "admin.tar.gz"
        - "private.zip"
        - "private.tar.gz"
        - "uploads.zip"
        - "uploads.tar.gz"
        - "files.zip"
        - "files.tar.gz"
        - "assets.zip"
        - "assets.tar.gz"
        - "old.zip"
        - "old.tar.gz"
        - "new.zip"
        - "new.tar.gz"
        - "prod.zip"
        - "prod.tar.gz"
        - "production.zip"
        - "production.tar.gz"
        - "staging.zip"
        - "staging.tar.gz"
        - "tmp.zip"
        - "tmp.tar.gz"
        - "var.zip"
        - "var.tar.gz"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        condition: or
        dsl:
          - "contains(tolower(header), 'application/zip')"
          - "contains(tolower(header), 'application/x-zip')"
          - "contains(tolower(header), 'application/x-gzip')"
          - "contains(tolower(header), 'application/gzip')"
          - "contains(tolower(header), 'application/x-tar')"
          - "contains(tolower(header), 'application/x-7z')"
          - "contains(tolower(header), 'application/x-rar')"
          - "contains(tolower(header), 'application/octet-stream')"
          - "contains(tolower(header), 'filename=')"
          - "contains(tolower(body), 'create table')"
          - "contains(tolower(body), 'insert into')"
          - "contains(tolower(body), 'mysqldump')"
          - "contains(tolower(body), 'postgresql database dump')"
          - "contains(tolower(body), 'db_password')"
          - "contains(tolower(body), 'database_url')"

      - type: dsl
        dsl:
          - "len(body) > 128"
          - "len(body) < 104857600"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)(content-type|content-disposition): [^\\r\\n]+"

