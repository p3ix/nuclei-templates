id: exposed-headscale-api

info:
  name: Exposed Headscale Self-Hosted Tailscale Control Server
  author: p3i
  severity: critical
  description: >
    Detects Headscale (open-source self-hosted Tailscale control server) instances
    with the API accessible without authentication. Headscale manages a WireGuard
    mesh VPN network (compatible with Tailscale clients). When the Headscale API
    is accessible without an API key, an attacker can: list all registered nodes
    with their IP addresses and WireGuard public keys, enumerate all users and
    namespaces (which represent network segments), list all pre-authentication
    keys (which can be used to add new nodes to the VPN), and generate new auth
    keys providing VPN access to the private mesh network. The Headscale web UI
    and API run on port 8080 by default and are intended for internal administration
    only. Exposed Headscale instances directly expose the internal VPN topology.
  reference:
    - https://headscale.net/docs/
    - https://github.com/juanfont/headscale
  tags: exposure,headscale,tailscale,wireguard,vpn,mesh-network,critical,infrastructure
  metadata:
    max-request: 6

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/node"
      - "{{BaseURL}}/api/v1/user"
      - "{{BaseURL}}/api/v1/preauthkey"
      - "{{BaseURL}}/api/v1/route"
      - "{{BaseURL}}/health"
      - "{{BaseURL}}/metrics"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"machineKey\":"
          - "\"nodeKey\":"
          - "\"discoKey\":"
          - "\"givenName\":"
          - "\"registeredTags\":"
          - "\"ipAddresses\":"
          - "\"preauthkeys\":"
          - "\"headscale_"
          - "\"advertiseRoutes\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'machineKey') ||
            contains(body, 'nodeKey') ||
            contains(body, 'discoKey') ||
            contains(body, 'registeredTags') ||
            contains(body, 'preauthkeys') ||
            contains(body, 'headscale_')
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(machineKey|nodeKey|givenName|ipAddresses|name)"\s*:\s*"?[^",}{]{1,200}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
