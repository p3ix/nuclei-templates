id: exposed-meilisearch-api

info:
  name: Exposed Meilisearch Full-Text Search Engine Without Authentication
  author: p3i
  severity: high
  description: >
    Detects Meilisearch (open-source full-text search engine) instances with
    the API accessible without authentication. Meilisearch is commonly used
    as a search backend for web applications — the indexed data reflects the
    application's content including: user records (names, emails, profile data),
    product catalogs with pricing, internal documentation, customer records,
    and any other content the application indexes for search. When the master
    key is not set (the default in development), or when an API key with
    administrative scope is used without restriction, an attacker can: list
    all search indexes and their document counts, query any index and extract
    all indexed documents, retrieve the task history (revealing which data
    operations were performed), and potentially delete indexes or modify
    settings. Meilisearch uses a master key for authentication — if absent,
    all endpoints are publicly accessible.
  reference:
    - https://www.meilisearch.com/docs/learn/security/master_api_keys
    - https://github.com/meilisearch/meilisearch
  tags: exposure,meilisearch,search,database,documents,api,data
  metadata:
    max-request: 6

http:
  - method: GET
    path:
      - "{{BaseURL}}/indexes"
      - "{{BaseURL}}/version"
      - "{{BaseURL}}/health"
      - "{{BaseURL}}/stats"
      - "{{BaseURL}}/tasks?limit=5"
      - "{{BaseURL}}/keys"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"meilisearch\":"
          - "\"pkgVersion\":"
          - "\"commitSha\":"
          - "\"numberOfDocuments\":"
          - "\"isIndexing\":"
          - "\"fieldDistribution\":"
          - "\"enqueuedAt\":"
          - "\"commitDate\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'pkgVersion') ||
            contains(body, 'commitSha') ||
            contains(body, 'numberOfDocuments') ||
            contains(body, 'fieldDistribution') ||
            contains(body, 'commitDate') ||
            (contains(body, 'isIndexing') && contains(body, 'enqueuedAt'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(pkgVersion|commitSha|uid|numberOfDocuments)"\s*:\s*"?[^",}{]{1,150}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
