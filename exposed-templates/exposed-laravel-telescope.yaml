id: exposed-laravel-telescope

info:
  name: Exposed Laravel Telescope Debug Dashboard
  author: p3i
  severity: high
  description: >
    Detects publicly accessible Laravel Telescope debug dashboards. Telescope captures
    every HTTP request (headers, bodies, session data), all SQL queries and their
    bindings, exception stack traces, queue jobs, scheduled commands, Redis operations,
    and mail previews in real time. Unauthenticated access directly exposes user PII
    from captured requests, database credentials from query errors, secret keys from
    exception traces, and the complete application data flow.
  reference:
    - https://laravel.com/docs/telescope
  tags: exposure,laravel,telescope,php,debug
  metadata:
    max-request: 18

flow: http(1) && http(2)

http:
  # Baseline: reject catch-all hosts (WordPress, SPAs, etc.) that serve 200 for any path.
  - method: GET
    path:
      - "{{BaseURL}}/nuclei-fp-check-{{randstr}}-notexist"
    redirects: false
    matchers:
      - type: dsl
        internal: true
        dsl:
          - "status_code != 200"

  - method: GET
    path:
      - "{{BaseURL}}/telescope"
      - "{{BaseURL}}/telescope/"
      - "{{BaseURL}}/telescope/requests"
      - "{{BaseURL}}/telescope/exceptions"
      - "{{BaseURL}}/telescope/logs"
      - "{{BaseURL}}/telescope/queries"
      - "{{BaseURL}}/telescope/jobs"
      - "{{BaseURL}}/telescope/cache"
      - "{{BaseURL}}/telescope/mail"
      - "{{BaseURL}}/telescope/notifications"
      - "{{BaseURL}}/telescope/api/requests"
      - "{{BaseURL}}/telescope/api/exceptions"
      - "{{BaseURL}}/telescope/api/logs"
      - "{{BaseURL}}/telescope/api/queries"
      - "{{BaseURL}}/telescope/api/jobs"
      - "{{BaseURL}}/telescope/api/cache"
      - "{{BaseURL}}/telescope/api/mail"

    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Require unambiguous Telescope-specific strings — "Illuminate\" removed because it
      # appears in exception pages of ANY Laravel app, not just Telescope.
      # "familyHash" and "batchId" are Telescope internal model fields.
      - type: word
        part: body
        condition: or
        words:
          - "Laravel Telescope"
          - "\"familyHash\""
          - "\"batchId\""
          - "telescope/telescope.js"
          - "telescope/app.js"
          - "telescopeScriptVariables"

      # Disambiguate: require the indicator appears in a Telescope-context response,
      # not just any Laravel page that happened to mention Telescope in a blog link.
      - type: dsl
        dsl:
          - >-
            contains(body, 'familyHash') ||
            contains(body, 'batchId') ||
            (contains(tolower(body), 'laravel telescope') && (contains(tolower(header), 'application/json') || contains(body, 'telescope/telescope.js') || contains(body, 'telescopeScriptVariables')))
          - "len(body) < 52428800"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(authorization|bearer|cookie|password|token|api[_-]?key|exception|/telescope/api/[a-z0-9_-]+).{0,180}"
      - type: dsl
        name: status
        dsl:
          - "status_code"
