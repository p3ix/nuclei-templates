id: exposed-cloud-credentials

info:
  name: Exposed Cloud Credentials And IaC State
  author: p3i
  severity: critical
  description: Detects exposed cloud credential files, Terraform/OpenTofu state files, Kubernetes configs, and provider-specific secrets.
  tags: exposure,cloud,secrets,aws,gcp,azure,kubernetes,terraform
  metadata:
    max-request: 58

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cloud_file}}"

    payloads:
      cloud_file:
        - ".aws/credentials"
        - ".aws/config"
        - "aws/credentials"
        - "aws/config"
        - "credentials"
        - ".credentials"
        - ".s3cfg"
        - "s3cfg"
        - ".boto"
        - "boto.cfg"
        - ".gcloud/credentials.db"
        - ".config/gcloud/application_default_credentials.json"
        - "application_default_credentials.json"
        - "service-account.json"
        - "service_account.json"
        - "gcp-service-account.json"
        - "google-service-account.json"
        - "firebase-service-account.json"
        - "firebase.json"
        - "azureProfile.json"
        - "accessTokens.json"
        - ".azure/accessTokens.json"
        - ".azure/azureProfile.json"
        - ".kube/config"
        - "kubeconfig"
        - "kube.config"
        - "admin.conf"
        - "terraform.tfstate"
        - "terraform.tfstate.backup"
        - "tofu.tfstate"
        - "tofu.tfstate.backup"
        - ".terraform/terraform.tfstate"
        - ".terraform.lock.hcl"
        - "terraform/terraform.tfstate"
        - "infra/terraform.tfstate"
        - "infrastructure/terraform.tfstate"
        - "deploy/terraform.tfstate"
        - "deployment/terraform.tfstate"
        - "pulumi.yaml"
        - "Pulumi.yaml"
        - "pulumi.dev.yaml"
        - "Pulumi.dev.yaml"
        - "pulumi.prod.yaml"
        - "Pulumi.prod.yaml"
        - "serverless.yml"
        - "serverless.yaml"
        - ".docker/config.json"
        - "docker/config.json"
        - ".dockercfg"
        - "rclone.conf"
        - ".rclone.conf"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "aws_access_key_id"
          - "aws_secret_access_key"
          - "AWS_ACCESS_KEY_ID"
          - "AWS_SECRET_ACCESS_KEY"
          - "client_email"
          - "private_key_id"
          - "auth_provider_x509_cert_url"
          - "refresh_token"
          - "accessToken"
          - "subscriptionId"
          - "tenantId"
          - "current-context:"
          - "certificate-authority-data:"
          - "client-certificate-data:"
          - "client-key-data:"
          - "\"terraform_version\""
          - "\"resources\""
          - "\"outputs\""
          - "\"sensitive\""
          - "pulumi:template"
          - "service:"
          - "\"auths\""
          - "\"credsStore\""
          - "type = s3"

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "!contains(tolower(body), '<!doctype')"
          - "len(body) < 5242880"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?im)(aws_access_key_id|aws_secret_access_key|client_email|private_key_id|refresh_token|accessToken|subscriptionId|tenantId)[\"'\\s:=]+[^\\r\\n,]+"

