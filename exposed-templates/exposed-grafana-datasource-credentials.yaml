id: exposed-grafana-datasource-credentials

info:
  name: Grafana Data Source Credentials Exposed Via API
  author: p3i
  severity: critical
  description: >
    Detects Grafana instances where the /api/datasources endpoint is accessible
    without authentication, exposing all configured data source connection details.
    Each data source entry includes the type (MySQL, PostgreSQL, InfluxDB, Prometheus,
    Elasticsearch, etc.), hostname, port, database name, and username. While Grafana
    redacts passwords in the API response, this is a high-value finding because:
    (1) the connection details alone enable targeted attacks against the underlying
    databases, (2) some Grafana versions or custom plugins leak passwords in cleartext,
    (3) /api/datasources/:id/health allows testing connectivity, and (4) proxied
    queries to each datasource may be executable via /api/datasources/proxy/:id/.
    This endpoint requires Viewer role or anonymous access — directly follow up
    exposed-grafana-access findings with this template.
  reference:
    - https://grafana.com/docs/grafana/latest/developers/http_api/data_source/
  tags: exposure,grafana,datasource,credentials,database,monitoring
  metadata:
    max-request: 4

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/datasources"
      - "{{BaseURL}}/grafana/api/datasources"
      - "{{BaseURL}}/api/datasources?type=&isDefault="
      - "{{BaseURL}}/api/datasources/1"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      # Require Grafana datasource API response structure
      - type: word
        part: body
        condition: or
        words:
          - "\"type\":"
          - "\"uid\":"
          - "\"orgId\":"
          - "\"url\":"
          - "\"database\":"
          - "\"jsonData\":"
          - "\"secureJsonFields\":"
          - "\"typeName\""
          - "\"isDefault\":"

      # Must have datasource-specific type names — not generic JSON
      - type: regex
        part: body
        regex:
          - '(?i)"type"\s*:\s*"(mysql|postgres|prometheus|elasticsearch|influxdb|graphite|opentsdb|cloudwatch|loki|tempo|mssql|mongodb|redis|cassandra|clickhouse|athena|bigquery)"'

      - type: word
        part: body
        negative: true
        words:
          - "<html"
          - "\"message\":\"Unauthorized\""
          - "\"message\":\"Forbidden\""
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(type|url|database|user|orgId|name|uid)"\s*:\s*"[^"]{1,200}"'
          - '(?i)"(mysql|postgres|prometheus|elasticsearch|influxdb|loki|mssql)"\s*[,}]'
      - type: dsl
        name: status
        dsl:
          - "status_code"
