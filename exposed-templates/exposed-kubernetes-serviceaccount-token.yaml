id: exposed-kubernetes-serviceaccount-token

info:
  name: Exposed Kubernetes Service Account Token
  author: p3i
  severity: critical
  description: Detects Kubernetes service account token files accidentally reachable from web roots or mounted secret paths. Requires a JWT-shaped token on Kubernetes-specific token paths to avoid low-impact namespace/CA disclosures and random-token false positives.
  tags: exposure,kubernetes,serviceaccount,token,secrets,critical
  metadata:
    max-request: 18

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuclei-fp-check-{{randstr}}-notexist"
    redirects: false
    matchers:
      - type: dsl
        internal: true
        dsl:
          - "status_code != 200"

  - method: GET
    path:
      - "{{BaseURL}}/{{sa_file}}"

    payloads:
      sa_file:
        - "var/run/secrets/kubernetes.io/serviceaccount/token"
        - "run/secrets/kubernetes.io/serviceaccount/token"
        - "secrets/kubernetes.io/serviceaccount/token"
        - "kubernetes.io/serviceaccount/token"
        - "serviceaccount/token"
        - "service-account/token"
        - "k8s/serviceaccount/token"
        - "k8s/token"
        - "kubernetes/token"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - >-
            (regex('^eyJ[a-zA-Z0-9_-]{10,}\\.[a-zA-Z0-9_-]{20,}\\.[a-zA-Z0-9_-]{20,}\\s*$', body) &&
            (contains(body, 'eyJpc3Mi') || contains(body, 'eyJrdWJlcm5ldGVzLmlv') || contains(sa_file, 'serviceaccount/token') || contains(sa_file, 'kubernetes/token') || contains(sa_file, 'k8s/token')))
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(header), 'content-type: text/html')"
          - "len(body) < 1048576"

    extractors:
      - type: regex
        part: body
        regex:
          - "^eyJ[a-zA-Z0-9_-]{10,}\\.[a-zA-Z0-9_-]{20,}\\.[a-zA-Z0-9_-]{20,}"
      - type: dsl
        name: status
        dsl:
          - "status_code"
