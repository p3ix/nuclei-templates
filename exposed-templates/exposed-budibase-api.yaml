id: exposed-budibase-api

info:
  name: Exposed Budibase Low-Code Platform Without Authentication
  author: p3i
  severity: high
  description: >
    Detects Budibase (open-source low-code platform) instances with the API
    accessible without authentication. Budibase is used to build internal tools,
    admin panels, and CRUD apps connected to various data sources including
    PostgreSQL, MySQL, MongoDB, REST APIs, S3, and more. Each configured "datasource"
    stores connection credentials. When accessible without authentication, an
    attacker can list all applications and their data source configurations,
    extract database credentials stored in datasource settings, enumerate internal
    tables and their schema, and potentially trigger automations.
  reference:
    - https://docs.budibase.com/docs/hosting-settings
    - https://github.com/Budibase/budibase
  tags: exposure,budibase,lowcode,internal-tools,datasource,credentials,database
  metadata:
    max-request: 7

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/applications"
      - "{{BaseURL}}/api/self"
      - "{{BaseURL}}/api/global/users"
      - "{{BaseURL}}/api/global/configs/checklist"
      - "{{BaseURL}}/api/datasources"
      - "{{BaseURL}}/api/tables"
      - "{{BaseURL}}/builder/api/applications"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"budibaseVersion\":"
          - "\"budibase-version\":"
          - "\"tenantId\":"
          - "\"datasourceId\":"
          - "\"appId\":"
          - "\"templateKey\":"
          - "\"updatedBy\":"
          - "\"accountPortalUrl\":"
          - "\"useQuotaInMs\":"
          - "\"budibase_type\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'budibaseVersion') ||
            contains(body, 'budibase-version') ||
            contains(body, 'budibase_type') ||
            contains(body, 'accountPortalUrl') ||
            (contains(body, 'tenantId') && contains(body, 'datasourceId')) ||
            (contains(body, 'appId') && contains(body, 'templateKey'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(budibaseVersion|budibase-version|name|tenantId|appId)"\s*:\s*"?[^",}{]{1,120}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
