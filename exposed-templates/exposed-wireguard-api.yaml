id: exposed-wireguard-api

info:
  name: Exposed WireGuard or VPN Management API Without Authentication
  author: p3i
  severity: high
  description: >
    Detects management API endpoints for WireGuard VPN configurations exposed
    without authentication. Third-party WireGuard management tools such as
    wg-easy, WireGuard UI, Subspace, and Netmaker expose web UIs and APIs for
    managing VPN configurations. When accessible without authentication, these
    expose: all peer (client) configurations including public keys and allowed
    IPs, the server's WireGuard public and private key material, client endpoint
    configurations that reveal internal network topology, and the ability to add
    new peers giving an attacker VPN access to the internal network.
    wg-easy in particular is commonly deployed on public-facing servers and
    often left with no or weak authentication.
  reference:
    - https://github.com/wg-easy/wg-easy
    - https://github.com/ngoduykhanh/wireguard-ui
  tags: exposure,wireguard,vpn,network,credentials,access-control,infrastructure
  metadata:
    max-request: 7

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/wireguard/client"
      - "{{BaseURL}}/api/clients"
      - "{{BaseURL}}/api/v1/peers"
      - "{{BaseURL}}/wg/client"
      - "{{BaseURL}}/api/wireguard/server"
      - "{{BaseURL}}/api/server"
      - "{{BaseURL}}/api/session"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"publicKey\":"
          - "\"privateKey\":"
          - "\"presharedKey\":"
          - "\"allowedIPs\":"
          - "\"AllowedIPs\":"
          - "\"transferRx\":"
          - "\"transferTx\":"
          - "\"persistentKeepalive\":"
          - "\"latestHandshakeAt\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'publicKey') &&
            (contains(body, 'allowedIPs') ||
             contains(body, 'AllowedIPs') ||
             contains(body, 'transferRx') ||
             contains(body, 'latestHandshakeAt') ||
             contains(body, 'persistentKeepalive'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(publicKey|privateKey|address|name|allowedIPs)"\s*:\s*"[^"]{1,200}"'
      - type: dsl
        name: status
        dsl:
          - "status_code"
