id: exposed-superset-api

info:
  name: Exposed Apache Superset Analytics Platform Without Authentication
  author: p3i
  severity: high
  description: >
    Detects Apache Superset (open-source data exploration and visualization
    platform) instances with the API accessible without authentication.
    Superset connects to data warehouses and databases — each configured
    "database" stores a complete SQLAlchemy connection URI including host,
    port, username, and password for PostgreSQL, MySQL, BigQuery, Redshift,
    Snowflake, Presto, Trino, and others. When the Superset API is accessible
    without a valid CSRF token and session, an attacker can: list all configured
    database connections with their connection URIs, enumerate saved charts and
    dashboards (revealing the data model and business metrics), access the SQL
    Lab to potentially run arbitrary queries against connected databases, and
    read dashboard embed tokens. Default Superset installations use a weak
    SECRET_KEY that is well-known and can be used to forge session cookies.
  reference:
    - https://superset.apache.org/docs/configuration/configuring-superset/
    - https://superset.apache.org/docs/api
  tags: exposure,superset,apache,bi,analytics,database,credentials,dashboard
  metadata:
    max-request: 8

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/database/?q=(page:0,page_size:5)"
      - "{{BaseURL}}/api/v1/chart/?q=(page:0,page_size:5)"
      - "{{BaseURL}}/api/v1/dashboard/?q=(page:0,page_size:5)"
      - "{{BaseURL}}/api/v1/dataset/?q=(page:0,page_size:5)"
      - "{{BaseURL}}/api/v1/saved_query/?q=(page:0,page_size:5)"
      - "{{BaseURL}}/superset/profile/"
      - "{{BaseURL}}/api/v1/security/login"
      - "{{BaseURL}}/health"

    headers:
      Accept: "application/json"
      Referer: "{{BaseURL}}"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"sqlalchemy_uri\":"
          - "\"database_name\":"
          - "\"allow_run_async\":"
          - "\"allow_ctas\":"
          - "\"superset_version\":"
          - "\"slice_name\":"
          - "\"datasource_id\":"
          - "\"expose_in_sqllab\":"
          - "\"allow_multi_schema_metadata_fetch\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'sqlalchemy_uri') ||
            contains(body, 'superset_version') ||
            contains(body, 'allow_run_async') ||
            contains(body, 'allow_ctas') ||
            (contains(body, 'database_name') && contains(body, 'expose_in_sqllab')) ||
            (contains(body, 'slice_name') && contains(body, 'datasource_id'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(superset_version|database_name|sqlalchemy_uri|allow_run_async)"\s*:\s*"?[^",}{]{1,200}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
