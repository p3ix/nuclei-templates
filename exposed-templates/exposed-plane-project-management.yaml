id: exposed-plane-project-management

info:
  name: Exposed Plane Self-Hosted Project Management Without Authentication
  author: p3i
  severity: high
  description: >
    Detects Plane (open-source Jira/Linear alternative) instances with the API
    accessible without authentication. Plane is used for project and issue tracking
    at startups and engineering teams. When accessible without authentication, an
    attacker can: list all workspaces, projects, and their members (revealing
    team structure and employee emails), read all issues/tasks including their
    descriptions (which may contain customer-reported bugs, security issues, or
    sensitive product information), access file attachments uploaded to issues,
    and view roadmaps and sprint data. Plane self-hosted deployments are increasingly
    common as teams migrate from proprietary tools.
  reference:
    - https://github.com/makeplane/plane
    - https://docs.plane.so/self-hosting
  tags: exposure,plane,project-management,issues,tasks,team,workspace
  metadata:
    max-request: 7

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/users/me/"
      - "{{BaseURL}}/api/v1/workspaces/"
      - "{{BaseURL}}/api/v1/instances/"
      - "{{BaseURL}}/api/v1/license/"
      - "{{BaseURL}}/auth/sign-in/"
      - "{{BaseURL}}/api/v1/users/me/settings/"
      - "{{BaseURL}}/api/v1/users/me/workspaces/"

    headers:
      Accept: "application/json"

    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
        case-insensitive: true

      - type: word
        part: body
        condition: or
        words:
          - "\"plane_version\":"
          - "\"is_activated\":"
          - "\"is_signup_disabled\":"
          - "\"workspaces\":"
          - "\"workspace_id\":"
          - "\"project_id\":"
          - "\"is_onboarded\":"
          - "\"onboarding_step\":"
          - "\"use_case\":"

      - type: dsl
        dsl:
          - >-
            contains(body, 'plane_version') ||
            contains(body, 'is_signup_disabled') ||
            contains(body, 'is_activated') ||
            (contains(body, 'workspace_id') && contains(body, 'is_onboarded')) ||
            (contains(body, 'workspaces') && contains(body, 'use_case'))
          - "!contains(tolower(body), '<html') && !contains(tolower(body), '<!doctype')"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)"(plane_version|name|workspace_id|is_activated)"\s*:\s*"?[^",}{]{1,120}"?'
      - type: dsl
        name: status
        dsl:
          - "status_code"
