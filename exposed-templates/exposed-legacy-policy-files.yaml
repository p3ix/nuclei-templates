# Fix: restrict to wildcard domain entries only — specific-domain allow-access-from entries (e.g. Salesforce CDN) are not exploitable.
id: exposed-legacy-policy-files

info:
  name: Exposed Legacy Cross-Domain Policy Files With Wildcard
  author: p3i
  severity: medium
  description: Detects crossdomain.xml / clientaccesspolicy.xml files that allow access from wildcard origins (domain="*" or domain="*.something"). Specific single-domain entries are not reported.
  tags: exposure,legacy,flash,silverlight,crossdomain,clientaccesspolicy
  metadata:
    max-request: 20
    verified: false
    false-positives: "Files with only specific named domains in allow-access-from are correctly excluded. Only wildcard entries (domain='*' or domain='*.example.com') trigger this finding."

http:
  - method: GET
    path:
      - "{{BaseURL}}/crossdomain.xml"
      - "{{BaseURL}}/clientaccesspolicy.xml"
      - "{{BaseURL}}/.well-known/crossdomain.xml"
      - "{{BaseURL}}/.well-known/clientaccesspolicy.xml"
      - "{{BaseURL}}/policy/crossdomain.xml"
      - "{{BaseURL}}/policy/clientaccesspolicy.xml"
      - "{{BaseURL}}/static/crossdomain.xml"
      - "{{BaseURL}}/static/clientaccesspolicy.xml"
      - "{{BaseURL}}/assets/crossdomain.xml"
      - "{{BaseURL}}/assets/clientaccesspolicy.xml"

    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "<cross-domain-policy"
          - "<access-policy"

      - type: regex
        part: body
        regex:
          # Only fire on wildcard entries: domain="*" (full wildcard) or domain="*.something" (partial wildcard)
          - "(?i)domain=\"\\*[^\"]*\""

      # Exclude: HTML error pages — a real policy file should be XML, not HTML
      - type: word
        part: body
        negative: true
        words:
          - "<html"
        case-insensitive: true

      - type: word
        part: header
        negative: true
        words:
          - "content-type: text/html"
        case-insensitive: true

      - type: dsl
        dsl:
          - "len(body) < 1048576"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<allow-access-from[^>]+domain=\"[^\"]+\"[^>]*>"
      - type: dsl
        name: status
        dsl:
          - "status_code"

# FIXED 2026-05-19: Converted HTML content-type and <html body exclusions from DSL to type:word negative:true matchers; severity raised low→medium; wildcard-only matching added in previous session.
