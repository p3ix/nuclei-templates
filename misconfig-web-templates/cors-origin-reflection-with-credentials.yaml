# FIXED 2026-05-20: Replaced randstr-based origin probe with fixed canary string.
# With attack:batteringram, {{randstr}} in the raw template is re-evaluated per payload iteration
# but DSL randstr may reference the compile-time value — causing the reflection check to silently pass
# on servers returning fixed ACAO values (e.g. "tv-unmatched-block"). Fixed canary + type:word matcher
# makes the reflection requirement unambiguous.
id: cors-origin-reflection-with-credentials

info:
  name: CORS Arbitrary Origin Reflection With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that reflect any arbitrary Origin header combined with Access-Control-Allow-Credentials true, enabling cross-origin authenticated reads from attacker-controlled pages. Uses a fixed canary origin confirmed with a plain word matcher.
  tags: misconfig,cors,credentials,headers,owasp,web
  metadata:
    max-request: 9
    verified: false
    false-positives: "Servers returning fixed ACAO values (e.g. tv-unmatched-block, own domain, null) without reflecting the sent origin. Verify the ACAO value equals the exact probe origin before reporting."

http:
  - raw:
      - |
        GET {{cors_path}} HTTP/1.1
        Host: {{Hostname}}
        Origin: https://nucleicors-canary.evil
        Accept: application/json, text/plain, */*
        Connection: close

    payloads:
      cors_path:
        - "/"
        - "/api"
        - "/api/v1"
        - "/api/v2"
        - "/account"
        - "/profile"
        - "/user"
        - "/me"
        - "/status"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # Server must echo back the exact canary — fixed-value ACAO (tv-unmatched-block, etc.) will not match
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Origin: https://nucleicors-canary.evil"
        case-insensitive: true

      # Credentials must be explicitly allowed — ACAO reflection without ACAC:true is unexploitable
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials: true"
        case-insensitive: true

      # Wildcard cannot combine with credentials per spec — wildcard responses are not exploitable
      - type: word
        part: header
        negative: true
        words:
          - "access-control-allow-origin: *"
        case-insensitive: true

      - type: dsl
        dsl:
          - "len(body) > 10"
          - "!contains(tolower(body), 'unauthorized')"
          - "!contains(tolower(body), 'unauthenticated')"
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'bot detection')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
