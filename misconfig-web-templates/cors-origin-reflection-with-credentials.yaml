# Fix: switched from method:GET to raw format so that {{randstr}} in the Origin header and
# randstr in the DSL matcher reference the same generated value within a single request execution.
# In method:GET templates, {{randstr}} in headers and randstr in DSL are evaluated independently,
# causing the reflection check to never match — Nuclei then mis-fires on status alone.
id: cors-origin-reflection-with-credentials

info:
  name: CORS Arbitrary Origin Reflection With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that reflect any arbitrary Origin header combined with Access-Control-Allow-Credentials true, enabling cross-origin authenticated reads from attacker-controlled pages. Uses a per-run random probe origin so reflection cannot be a coincidental pre-whitelisted entry.
  tags: misconfig,cors,credentials,headers,owasp,web
  metadata:
    max-request: 9
    verified: false
    false-positives: "Third-party SaaS APIs that legitimately allow cross-origin requests with credentials for known partner integrations — verify the reflected origin is truly arbitrary and not a whitelisted partner domain."

http:
  - raw:
      - |
        GET {{cors_path}} HTTP/1.1
        Host: {{Hostname}}
        Origin: https://nuclei-cors-test-{{randstr}}.evil.com
        Accept: application/json, text/plain, */*
        Connection: close

    payloads:
      cors_path:
        - "/"
        - "/api"
        - "/api/v1"
        - "/api/v2"
        - "/account"
        - "/profile"
        - "/user"
        - "/me"
        - "/status"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      - type: dsl
        dsl:
          # randstr is consistent between {{randstr}} in the raw request template and randstr in DSL
          # within the same request execution — a server that ignores Origin returns no ACAO header at all
          - "contains(tolower(header), 'access-control-allow-origin: https://nuclei-cors-test-' + randstr + '.evil.com')"
          - "contains(tolower(header), 'access-control-allow-credentials: true')"
          # ACAO:* cannot combine with ACAC:true per spec — wildcard is not exploitable with credentials
          - "!contains(tolower(header), 'access-control-allow-origin: *')"
          - "len(body) > 10"
          - "!contains(tolower(body), 'unauthorized')"
          - "!contains(tolower(body), 'unauthenticated')"
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'bot detection')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"

# FIXED 2026-05-19: Converted from method:GET to raw: format so {{randstr}} in Origin header and randstr in DSL matcher share the same generated value per execution — eliminates 4 FPs/scan where servers returned no ACAO header.
