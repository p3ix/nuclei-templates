# Detects the most common CORS misconfiguration: server reflects any arbitrary Origin with ACAC:true.
# Uses a per-run random probe origin so the reflection cannot be a pre-configured whitelist entry.
id: cors-origin-reflection-with-credentials

info:
  name: CORS Arbitrary Origin Reflection With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that reflect any arbitrary Origin header combined with Access-Control-Allow-Credentials true, enabling cross-origin authenticated reads from attacker-controlled pages.
  tags: misconfig,cors,credentials,headers,owasp,web
  metadata:
    max-request: 9
    verified: false
    false-positives: "Third-party SaaS APIs that legitimately allow cross-origin requests with credentials for known partner integrations — verify the reflected origin is truly arbitrary."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "https://{{randstr}}-cors-test.evil.com"
      Accept: "application/json, text/plain, */*"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/v1"
        - "api/v2"
        - "account"
        - "profile"
        - "user"
        - "me"
        - "status"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      - type: dsl
        dsl:
          # Server must reflect the randomized probe origin — pre-whitelisted origins cannot match randstr
          - "contains(tolower(header), 'access-control-allow-origin: https://' + randstr + '-cors-test.evil.com')"
          - "contains(tolower(header), 'access-control-allow-credentials: true')"
          # Spec: ACAO:* cannot combine with ACAC:true — reject any wildcard response
          - "!contains(tolower(header), 'access-control-allow-origin: *')"
          - "len(body) > 10"
          - "!contains(tolower(body), 'unauthorized')"
          - "!contains(tolower(body), 'unauthenticated')"
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'bot detection')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
