id: permissive-csp-policy

info:
  name: Permissive Or Bypassable Content Security Policy
  author: p3i
  severity: info
  description: Detects Content Security Policy headers that allow unsafe script execution patterns or overly broad sources, reducing XSS impact mitigation.
  tags: misconfig,csp,headers,xss,web
  metadata:
    max-request: 10

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{csp_path}}"

    payloads:
      csp_path:
        - ""
        - "login"
        - "signin"
        - "account"
        - "dashboard"
        - "admin"
        - "checkout"
        - "billing"
        - "portal"
        - "console"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "contains(tolower(header), 'content-security-policy:')"

      # Exclude Akamai/WAF block pages. A CSP on an access-denied page is not representative of app content.
      - type: word
        part: body
        negative: true
        words:
          - "Sorry! Access denied"
        case-insensitive: true

      - type: regex
        part: header
        condition: or
        regex:
          # unsafe-eval in script-src or default-src — nonce does not mitigate eval
          - "(?i)content-security-policy:[^\\r\\n]*(script-src|default-src)[^;\\r\\n]*'unsafe-eval'"
          # unsafe-inline in script-src (without nonce override)
          - "(?i)content-security-policy:[^\\r\\n]*script-src[^;\\r\\n]*'unsafe-inline'"
          # bare * wildcard as source in script-src or default-src (not *.domain.com)
          - "(?i)content-security-policy:[^\\r\\n]*(script-src|default-src)[^;\\r\\n]* \\*(?:[ \\t;]|$)"
          # object-src wildcard allows embedding arbitrary plugins/objects
          - "(?i)content-security-policy:[^\\r\\n]*object-src[ \\t]+\\*(?:[ \\t;]|$)"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)content-security-policy:[^\\r\\n]+"
