id: permissive-csp-policy

info:
  name: Permissive Or Bypassable Content Security Policy
  author: p3i
  severity: info
  description: Detects Content Security Policy headers that allow unsafe script execution patterns or overly broad sources, reducing XSS impact mitigation.
  tags: misconfig,csp,headers,xss,web
  metadata:
    max-request: 10

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{csp_path}}"

    payloads:
      csp_path:
        - ""
        - "login"
        - "signin"
        - "account"
        - "dashboard"
        - "admin"
        - "checkout"
        - "billing"
        - "portal"
        - "console"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "contains(tolower(header), 'content-security-policy:')"

      - type: dsl
        condition: or
        dsl:
          # unsafe-eval in script-src or default-src — nonce does not mitigate eval
          - "regex(\"(?i)content-security-policy:[^\\r\\n]*(script-src|default-src)[^;\\r\\n]*'unsafe-eval'\", header)"
          # unsafe-inline in script-src with no nonce — uncontrolled inline execution
          - "regex(\"(?i)content-security-policy:[^\\r\\n]*script-src[^;\\r\\n]*'unsafe-inline'\", header) && !regex(\"(?i)content-security-policy:[^\\r\\n]*script-src[^;\\r\\n]*'nonce-\", header)"
          # bare * wildcard as source in script-src or default-src (not *.domain.com)
          - "regex(\"(?i)content-security-policy:[^\\r\\n]*(script-src|default-src)[^;\\r\\n]* \\*(?:[ \\t;]|$)\", header)"
          # object-src wildcard allows embedding arbitrary plugins/objects
          - "regex(\"(?i)content-security-policy:[^\\r\\n]*object-src[ \\t]+\\*(?:[ \\t;]|$)\", header)"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)content-security-policy:[^\\r\\n]+"

