id: cookie-samesite-none-without-secure

info:
  name: SameSite None Cookie Without Secure
  author: p3i
  severity: medium
  description: Detects cookies using SameSite=None without the Secure attribute, which indicates weak cross-site cookie configuration and can break or weaken expected browser protections.
  tags: misconfig,cookies,samesite,secure,headers,web
  metadata:
    max-request: 16

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cookie_path}}"

    payloads:
      cookie_path:
        - ""
        - "login"
        - "signin"
        - "auth"
        - "sso"
        - "account"
        - "dashboard"
        - "admin"
        - "portal"
        - "billing"
        - "checkout"
        - "callback"
        - "oauth"
        - "api"
        - "graphql"
        - "profile"
        - "settings"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 302
          - 401
          - 403

      - type: dsl
        dsl:
          # Secure flag is only meaningful on HTTPS — skip HTTP targets entirely
          - "regex('^https://', BaseURL)"
          # Exclude known SaaS vendors where cookie behavior is by platform design
          - "!regex('(?i)(okta\\.com|statuspage\\.io|skilljar\\.com|safebase\\.io|pathfactory\\.com|zendesk\\.com|atlassian\\.com|auth0\\.com|intercom\\.io|hubspot\\.com|segment\\.io)', host)"

      # Prerequisite: response must actually set a cookie
      - type: word
        part: header
        words:
          - "set-cookie:"
        case-insensitive: true

      # Detect: any cookie uses SameSite=None
      - type: regex
        part: header
        regex:
          - '(?i)set-cookie:[^\r\n]*samesite=none'

      # Exclude: cookie with SameSite=None already has Secure (either order on the same line)
      - type: regex
        part: header
        negative: true
        regex:
          - '(?i)set-cookie:[^\r\n]*secure[^\r\n]*samesite=none'
          - '(?i)set-cookie:[^\r\n]*samesite=none[^\r\n]*secure'

      # Exclude: known third-party analytics/CDN/bot-protection cookies that use SameSite=None by design
      - type: regex
        part: header
        negative: true
        regex:
          - '(?i)set-cookie:\s*(__cf_bm|_cfuvid|__cflb|__cfduid|_ga|_gid|_gat|_fbp|_fbc|DT|rxVisitor|rxvt|_uetsid|_uetvid|OptanonConsent|CookieConsent|euconsent|dw_dnt|__cq_dnt|cquid|dwac_|datadome)='

    extractors:
      - type: regex
        part: header
        regex:
          - "(?im)^set-cookie:[^\\r\\n]*samesite=none[^\\r\\n]*"

# FIXED 2026-05-19: Replaced DSL matchers with explicit type:word/type:regex+negative:true matchers to eliminate ~30 FPs/scan on endpoints that set no cookies or where Secure was already present on the same line.

