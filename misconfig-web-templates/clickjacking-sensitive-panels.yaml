id: clickjacking-sensitive-panels

info:
  name: Clickjacking Protection Missing On Sensitive Pages
  author: p3i
  severity: medium
  description: Detects sensitive-looking pages that do not set X-Frame-Options or CSP frame-ancestors, making them candidates for clickjacking impact review.
  tags: misconfig,clickjacking,headers,csp,web
  metadata:
    max-request: 18

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{panel_path}}"

    payloads:
      panel_path:
        - "login"
        - "signin"
        - "auth"
        - "account"
        - "profile"
        - "settings"
        - "dashboard"
        - "admin"
        - "administrator"
        - "portal"
        - "console"
        - "manage"
        - "billing"
        - "payment"
        - "checkout"
        - "cart"
        - "reset-password"
        - "password-reset"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Response must be HTML
      - type: word
        part: header
        words:
          - "content-type: text/html"
        case-insensitive: true

      # X-Frame-Options must be absent — presence of any value is sufficient protection
      - type: word
        part: header
        negative: true
        words:
          - "x-frame-options:"
        case-insensitive: true

      # CSP frame-ancestors must be absent — presence is sufficient protection
      - type: word
        part: header
        negative: true
        words:
          - "frame-ancestors"
        case-insensitive: true

      # Require sensitive-page signals in body to reduce noise on generic HTML pages
      - type: dsl
        dsl:
          - "contains(tolower(body), 'password') || (contains(tolower(body), '<form') && (contains(tolower(body), 'csrf') || contains(tolower(body), 'token') || contains(tolower(body), 'billing') || contains(tolower(body), 'payment') || contains(tolower(body), 'account') || contains(tolower(body), 'dashboard') || contains(tolower(body), 'settings')))"

      # Exclude: error/access-denied pages
      - type: word
        part: body
        negative: true
        words:
          - "access denied"
          - "permission to access"
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<title>[^<]{0,160}(login|sign in|account|dashboard|settings|billing|checkout|admin)[^<]{0,160}</title>"

# FIXED 2026-05-19: Replaced DSL negations for X-Frame-Options and frame-ancestors with explicit type:word negative:true matchers; content-type check moved to type:word matcher. Eliminates ~7 FPs/scan on pages that already have clickjacking protection.

