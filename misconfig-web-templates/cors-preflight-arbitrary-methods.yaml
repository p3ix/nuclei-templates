id: cors-preflight-arbitrary-methods

info:
  name: Permissive CORS Preflight Allows Dangerous Methods
  author: p3i
  severity: medium
  description: Detects CORS preflight responses that trust an arbitrary Origin and allow dangerous methods or authorization headers.
  tags: misconfig,cors,preflight,methods,headers,web
  metadata:
    max-request: 12

http:
  - method: OPTIONS
    path:
      - "{{BaseURL}}/{{preflight_path}}"

    headers:
      Origin: "https://cors-preflight-bugbounty.example"
      Access-Control-Request-Method: "DELETE"
      Access-Control-Request-Headers: "authorization,x-bugbounty-header"

    payloads:
      preflight_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "admin"
        - "upload"
        - "files"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # Canary origin must be reflected specifically in ACAO — monolithic DSL contains() on the full
      # header blob matched the domain anywhere (e.g. Server:, Link:, X-Echo-* headers).
      - type: word
        part: header
        words:
          - "access-control-allow-origin: https://cors-preflight-bugbounty.example"
        case-insensitive: true

      # Wildcard ACAO cannot combine with credentials per spec — not exploitable.
      - type: word
        part: header
        negative: true
        words:
          - "access-control-allow-origin: *"
        case-insensitive: true

      # Credentials must be explicitly allowed.
      - type: word
        part: header
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true

      # Dangerous verb must appear specifically in Access-Control-Allow-Methods — not anywhere in
      # all response headers. Old contains(header,'delete') fired on "Server: PutNode/1.0" etc.
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-methods:[^\r\n]*(delete|put|patch)"

      # Authorization must be permitted specifically in Access-Control-Allow-Headers — not just the
      # word "authorization" appearing in WWW-Authenticate or any other header.
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-headers:[^\r\n]*(authorization|\\*)"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
