id: broad-cookie-domain-sensitive

info:
  name: Broad Cookie Domain On Sensitive Pages
  author: p3i
  severity: low
  description: Detects sensitive-looking pages that set session or authentication cookies scoped to a parent domain, which increases risk when sibling subdomains are compromised. Third-party analytics and bot-protection cookies are excluded.
  tags: misconfig,cookies,domain,session,headers,web
  metadata:
    max-request: 16
    verified: false
    false-positives: "Bot-protection services (DataDome, Cloudflare, PerimeterX) and analytics platforms (GA, Hotjar, Segment, Amplitude) use broad Domain scoping by design. Excluded via cookie-name filter."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cookie_domain_path}}"

    payloads:
      cookie_domain_path:
        - ""
        - "login"
        - "signin"
        - "auth"
        - "sso"
        - "account"
        - "profile"
        - "settings"
        - "dashboard"
        - "admin"
        - "portal"
        - "billing"
        - "checkout"
        - "callback"
        - "oauth"
        - "register"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 302
          - 401
          - 403

      - type: regex
        part: header
        condition: or
        regex:
          # Cookie NAME starts with a session/auth keyword (most precise)
          - "(?im)^set-cookie:\\s*(session|sid|sess|auth|token|jwt|remember|csrf|xsrf|user|account)[^\\r\\n]*;\\s*domain=\\.[a-z0-9.-]+"
          # Cookie NAME (before the '=') contains a session/auth keyword — [^=\r\n]* stops at '=' so the
          # value is never scanned (prevents FP when value contains 'session', e.g. datadome=xxxsessionxxx)
          - "(?im)^set-cookie:\\s*[^=\\r\\n]*(session|sid|sess|auth|token|jwt|remember|user|account)[^=\\r\\n]*=[^\\r\\n]*;\\s*domain=\\.[a-z0-9.-]+"

      # Exclude: WAF/CDN security cookies and common third-party analytics/tracking cookies.
      # These services require broad Domain scope by design and are not application session cookies.
      - type: regex
        part: header
        negative: true
        regex:
          - '(?i)set-cookie:\s*(visid_incap_|incap_ses_|__cfduid|cf_clearance|_abck|ak_bmsc|bm_sz|datadome|_ga|_gid|_gat|_fbp|_fbc|__utm|_hj|ajs_|intercom-|intercom_|amplitude_|drift_|mixpanel|crisp-|_ym_)='

    extractors:
      - type: regex
        part: header
        regex:
          - "(?im)^set-cookie:[^\\r\\n]*;\\s*domain=\\.[^;\\r\\n]+[^\\r\\n]*"

# FIXED 2026-05-19: Converted third-party cookie exclusion from DSL to type:regex negative:true matcher. Also fixed [^\r\n]* → [^=\r\n]* in previous session to prevent keyword matching inside cookie values.
