id: cors-null-origin-credentials

info:
  name: CORS Null Origin With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that allow the null Origin together with credentials, which can enable authenticated cross-origin reads from sandboxed documents or local files in vulnerable flows.
  tags: misconfig,cors,null-origin,credentials,headers,web
  metadata:
    max-request: 14

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "null"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "status"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # ACAO must be exactly "null" — exact-line match prevents substring collisions (e.g. nullsite.com)
      - type: regex
        part: header
        regex:
          - '(?im)^access-control-allow-origin:\s*null\s*$'

      # ACAC:true required — server ignoring Origin returns no CORS headers at all
      - type: word
        part: header
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true

      # Exclude: WAF/challenge interception pages — not real CORS responses
      - type: word
        part: body
        negative: true
        words:
          - "captcha"
          - "validation required"
          - "bot detection"
        case-insensitive: true

      - type: regex
        part: body
        negative: true
        regex:
          - '(?i)bnis_|incapsula|imperva'

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"

# FIXED 2026-05-19: Replaced DSL matchers with explicit type:regex (ACAO:null exact-line match), type:word (ACAC:true), and type:word/type:regex negative:true (challenge-page exclusions) to eliminate :status FPs.
