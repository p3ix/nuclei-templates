id: cors-null-origin-credentials

info:
  name: CORS Null Origin With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that allow the null Origin together with credentials, which can enable authenticated cross-origin reads from sandboxed documents or local files in vulnerable flows.
  tags: misconfig,cors,null-origin,credentials,headers,web
  metadata:
    max-request: 14

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "null"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "status"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      - type: dsl
        dsl:
          # Null origin acceptance is the misconfiguration; credentials header strengthens the finding
          - "contains(tolower(header), 'access-control-allow-origin: null')"
          # Exclude bot-detection / captcha challenge pages — they are not real CORS responses
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'validation required') && !contains(tolower(body), 'bot detection') && !regex('(?i)bnis_|incapsula|imperva', body)"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"

