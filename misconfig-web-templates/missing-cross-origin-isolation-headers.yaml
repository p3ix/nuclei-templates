id: missing-cross-origin-isolation-headers

info:
  name: Cross-Origin Isolation Headers Missing On Sensitive Pages
  author: p3i
  severity: info
  description: Detects sensitive pages missing COOP, COEP, and CORP headers. This is primarily a hardening signal for apps handling sensitive data or using powerful browser APIs.
  tags: misconfig,coop,coep,corp,headers,web
  metadata:
    max-request: 14
    requires_manual_verification: true
    note: "COOP/COEP/CORP absence is usually informational. This template only reports pages with SharedArrayBuffer/crossOriginIsolated/postMessage signals and still requires manual impact review."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{isolation_path}}"

    payloads:
      isolation_path:
        - ""
        - "login"
        - "signin"
        - "account"
        - "profile"
        - "settings"
        - "dashboard"
        - "admin"
        - "portal"
        - "billing"
        - "checkout"
        - "payment"
        - "app"
        - "console"

    attack: batteringram
    redirects: false
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Response must be HTML
      - type: word
        part: header
        words:
          - "content-type: text/html"
        case-insensitive: true

      # COOP must be absent — presence indicates cross-origin isolation is in place
      - type: word
        part: header
        negative: true
        words:
          - "cross-origin-opener-policy"
        case-insensitive: true

      # COEP must be absent — both COOP+COEP are required for full cross-origin isolation
      - type: word
        part: header
        negative: true
        words:
          - "cross-origin-embedder-policy"
        case-insensitive: true

      # CORP must be absent — all three headers absent = no cross-origin isolation at all
      - type: word
        part: header
        negative: true
        words:
          - "cross-origin-resource-policy"
        case-insensitive: true

      # Require sensitive-page body signals to reduce noise on generic pages
      - type: dsl
        dsl:
          - "contains(tolower(body), 'sharedarraybuffer') || contains(tolower(body), 'crossoriginisolated') || contains(tolower(body), 'postmessage') || contains(tolower(body), 'cross-origin')"

      # Exclude error/access-denied pages
      - type: word
        part: body
        negative: true
        words:
          - "access denied"
          - "permission to access"
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<title>[^<]{0,180}</title>"
