id: missing-security-headers-sensitive

info:
  name: Multiple Security Headers Missing On Sensitive Pages
  author: p3i
  severity: low
  description: Detects sensitive-looking pages that are missing several baseline browser security headers, useful for hardening review and chained impact. Block pages, WAF denials, and forbidden/access-denied responses are filtered to reduce low-value noise.
  tags: misconfig,security-headers,headers,web
  metadata:
    max-request: 16

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{sensitive_path}}"

    payloads:
      sensitive_path:
        - "login"
        - "signin"
        - "auth"
        - "account"
        - "settings"
        - "dashboard"
        - "admin"
        - "portal"
        - "console"
        - "billing"
        - "payment"
        - "checkout"
        - "profile"
        - "password-reset"
        - "reset-password"
        - "register"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "contains(tolower(header), 'content-type: text/html')"
          - "!regex('(?i)^(http/\\d(?:\\.\\d)?\\s+)?(?:401|403|407|451)\\b', header)"
          - "!regex('(?i)(^|\\n)(cf-mitigated|x-sucuri-block|x-iinfo|x-distil|x-datadome)\\s*:', header)"
          - "!contains(tolower(header), 'content-security-policy:')"
          - "!contains(tolower(header), 'x-frame-options:')"
          - "!contains(tolower(header), 'x-content-type-options: nosniff')"
          - "!contains(tolower(header), 'referrer-policy:')"
          - "contains(tolower(body), '<form') && (contains(tolower(body), 'password') || contains(tolower(body), 'csrf') || contains(tolower(body), 'email') || contains(tolower(body), 'username'))"
          - "!contains(tolower(body), 'sorry! access denied')"
          - "!regex('(?i)(access denied|access forbidden|forbidden|request blocked|blocked by|not authorized|unauthorized|permission to access|you don.?t have permission|error\\s*403|403\\s*forbidden|temporarily unavailable|security policy|waf|web application firewall|bot detection|captcha|attention required|cloudflare ray id|generated by cloudfront|the request could not be satisfied|akamai|incapsula|imperva|sucuri website firewall)', body)"
          - "!regex('(?i)<title>\\s*(access denied|forbidden|unauthorized|attention required|request blocked|error\\s*403|403\\s*forbidden)[^<]*</title>', body)"
          - "len(body) > 500"
          - "len(body) < 1048576"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<title>[^<]{0,180}</title>"
