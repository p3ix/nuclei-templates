# FIXED 2026-05-20: Replaced randstr-based origin probe with fixed canary string.
# Same root cause as cors-origin-reflection-with-credentials.yaml — see that file for full explanation.
id: cors-origin-reflection-sensitive-path

info:
  name: CORS Arbitrary Origin Reflection With Credentials On Auth Path
  author: p3i
  severity: critical
  description: Detects CORS origin reflection with credentials on authentication-critical paths such as login, token, and OAuth callback endpoints, where cross-origin reads can capture session tokens or credentials directly.
  tags: misconfig,cors,credentials,headers,owasp,auth,web
  metadata:
    max-request: 7
    verified: false
    false-positives: "Servers returning fixed ACAO values (e.g. tv-unmatched-block, own domain) without reflecting the sent origin. SSO providers with known partner origin whitelists — verify the reflected value is the canary, not a pre-registered partner domain."

http:
  - raw:
      - |
        GET {{auth_path}} HTTP/1.1
        Host: {{Hostname}}
        Origin: https://nucleicors-canary.evil
        Accept: application/json, text/plain, */*
        Connection: close

    payloads:
      auth_path:
        - "/login"
        - "/signin"
        - "/auth"
        - "/oauth"
        - "/callback"
        - "/token"
        - "/refresh"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # Server must echo back the exact canary — fixed-value ACAO responses will not match
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Origin: https://nucleicors-canary.evil"
        case-insensitive: true

      # Credentials must be explicitly allowed
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials: true"
        case-insensitive: true

      # Wildcard cannot combine with credentials per spec
      - type: word
        part: header
        negative: true
        words:
          - "access-control-allow-origin: *"
        case-insensitive: true

      - type: dsl
        dsl:
          - "len(body) > 10"
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'bot detection')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
