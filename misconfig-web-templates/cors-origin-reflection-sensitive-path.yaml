# Fix: switched from method:GET to raw format — same randstr consistency fix as
# cors-origin-reflection-with-credentials.yaml. See that template for root cause explanation.
id: cors-origin-reflection-sensitive-path

info:
  name: CORS Arbitrary Origin Reflection With Credentials On Auth Path
  author: p3i
  severity: critical
  description: Detects CORS origin reflection with credentials on authentication-critical paths such as login, token, and OAuth callback endpoints, where cross-origin reads can capture session tokens or credentials directly.
  tags: misconfig,cors,credentials,headers,owasp,auth,web
  metadata:
    max-request: 7
    verified: false
    false-positives: "SSO providers and OAuth servers that legitimately allow cross-origin auth flows for known partner origins — verify the reflected origin is truly arbitrary and not from a registered OAuth client."

http:
  - raw:
      - |
        GET {{auth_path}} HTTP/1.1
        Host: {{Hostname}}
        Origin: https://nuclei-cors-test-{{randstr}}.evil.com
        Accept: application/json, text/plain, */*
        Connection: close

    payloads:
      auth_path:
        - "/login"
        - "/signin"
        - "/auth"
        - "/oauth"
        - "/callback"
        - "/token"
        - "/refresh"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      - type: dsl
        dsl:
          - "contains(tolower(header), 'access-control-allow-origin: https://nuclei-cors-test-' + randstr + '.evil.com')"
          - "contains(tolower(header), 'access-control-allow-credentials: true')"
          - "!contains(tolower(header), 'access-control-allow-origin: *')"
          - "len(body) > 10"
          - "!contains(tolower(body), 'captcha') && !contains(tolower(body), 'bot detection')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"

# FIXED 2026-05-19: Uses raw: format for randstr consistency (same fix as cors-origin-reflection-with-credentials). Critical severity for auth-path CORS reflection.
