id: cache-poisoning-header-reflection

info:
  name: Web Cache Poisoning Header Reflection Candidate
  author: p3i
  severity: medium
  description: Detects cacheable responses that reflect attacker-controlled proxy headers, a common precondition for web cache poisoning. Uses a unique random probe value to confirm actual reflection rather than static string matching.
  tags: misconfig,cache,poisoning,headers,cdn,web
  metadata:
    max-request: 7

http:
  - raw:
      - |
        GET {{cache_path}} HTTP/1.1
        Host: {{Hostname}}
        X-Forwarded-Host: probe-{{randstr}}.bb
        X-Host: probe-{{randstr}}.bb
        X-Original-URL: /probe-{{randstr}}.css
        X-Rewrite-URL: /probe-{{randstr}}.css
        X-Forwarded-Scheme: https
        X-Forwarded-Proto: https
        Connection: close

    payloads:
      cache_path:
        - "/"
        - "/?cachebuster=cachepoisontest"
        - "/login?cachebuster=cachepoisontest"
        - "/app?cachebuster=cachepoisontest"
        - "/dashboard?cachebuster=cachepoisontest"
        - "/static/../?cachebuster=cachepoisontest"
        - "/assets/../?cachebuster=cachepoisontest"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 301
          - 302
          - 303
          - 307
          - 308

      # Reflection check: probe value appears in redirect Location or in body HTML attributes (randstr keeps this in DSL)
      - type: dsl
        dsl:
          - "(contains(tolower(header), 'location:') && contains(header, 'probe-' + randstr + '.bb')) || (contains(body, 'probe-' + randstr + '.bb') && (contains(tolower(body), 'href=') || contains(tolower(body), 'src=') || contains(tolower(body), 'action=') || contains(tolower(body), 'canonical') || contains(tolower(body), 'base href')))"

      # Positive proof of active caching — at least one cache-hit signal must be present
      - type: regex
        part: header
        condition: or
        regex:
          - '(?i)x-cache:\s*hit'
          - '(?i)cf-cache-status:\s*(hit|stale)'
          - '(?i)s-maxage'
          - '(?i)surrogate-control:'
          - '(?i)surrogate-key:'
          - '(?i)x-varnish:'
          - '(?im)^age:\s*[1-9][0-9]*\s*$'
          - '(?i)(?:^|[;,\s])max-age=[1-9][0-9]*'

      # Exclude: cache-miss/bypass/uncacheable signals — response not served from cache
      - type: regex
        part: header
        negative: true
        regex:
          - '(?i)x-cache:\s*(error|miss)'
          - '(?i)cf-cache-status:\s*(dynamic|miss|bypass)'
          - '(?i)cache-control:[^\r\n]*(no-store|no-cache|must-revalidate|private)'
          - '(?i)via:[^\r\n]*redirect'

      # Exclude: Cloudflare visit_scheme pseudo-reflection — not a real header injection
      - type: word
        part: body
        negative: true
        words:
          - "visit_scheme="
        case-insensitive: true

    extractors:
      - type: regex
        part: all
        regex:
          - "(?i)(x-cache|cf-cache-status|age|via|cache-control|surrogate-control):[^\\r\\n]+"
          - "(?i)(location:|href=|src=|canonical|base href|url\\()[^\\r\\n<>]{0,160}(probe-[a-z0-9]+-[a-z0-9]+\\.bb|/probe-[a-z0-9]+-[a-z0-9]+\\.css)[^\\r\\n<>]{0,160}"

# FIXED 2026-05-19: Replaced monolithic DSL with separate matchers — type:regex condition:or for positive cache evidence, type:regex negative:true for miss/bypass/no-cache exclusions, type:word negative:true for visit_scheme. Eliminates ~8 FPs/scan on uncached responses.

