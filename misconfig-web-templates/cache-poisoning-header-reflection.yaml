id: cache-poisoning-header-reflection

info:
  name: Web Cache Poisoning Header Reflection Candidate
  author: p3i
  severity: medium
  description: Detects cacheable responses that reflect attacker-controlled proxy headers, a common precondition for web cache poisoning. Uses a unique random probe value to confirm actual reflection rather than static string matching.
  tags: misconfig,cache,poisoning,headers,cdn,web
  metadata:
    max-request: 7

http:
  - raw:
      - |
        GET {{cache_path}} HTTP/1.1
        Host: {{Hostname}}
        X-Forwarded-Host: probe-{{randstr}}.bb
        X-Host: probe-{{randstr}}.bb
        X-Original-URL: /probe-{{randstr}}.css
        X-Rewrite-URL: /probe-{{randstr}}.css
        X-Forwarded-Scheme: https
        X-Forwarded-Proto: https
        Connection: close

    payloads:
      cache_path:
        - "/"
        - "/?cachebuster=cachepoisontest"
        - "/login?cachebuster=cachepoisontest"
        - "/app?cachebuster=cachepoisontest"
        - "/dashboard?cachebuster=cachepoisontest"
        - "/static/../?cachebuster=cachepoisontest"
        - "/assets/../?cachebuster=cachepoisontest"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 301
          - 302
          - 303
          - 307
          - 308

      - type: dsl
        dsl:
          - "(contains(tolower(header), 'location:') && contains(header, 'probe-' + randstr + '.bb')) || (contains(body, 'probe-' + randstr + '.bb') && (contains(tolower(body), 'href=') || contains(tolower(body), 'src=') || contains(tolower(body), 'action=') || contains(tolower(body), 'canonical') || contains(tolower(body), 'base href')))"
          - "!contains(tolower(header), 'x-cache: error') && !contains(tolower(header), 'x-cache: miss') && !contains(tolower(header), 'cache-control: private') && !contains(tolower(header), 'cf-cache-status: dynamic') && !contains(tolower(header), 'cf-cache-status: miss') && !contains(tolower(header), 'cf-cache-status: bypass') && !contains(tolower(header), 'cache-control: no-store') && !contains(tolower(header), 'must-revalidate')"
          - "!contains(tolower(body), 'visit_scheme=')"
          - "contains(tolower(header), 'x-cache: hit') || contains(tolower(header), 'cf-cache-status: hit') || contains(tolower(header), 'cf-cache-status: stale') || contains(tolower(header), 's-maxage') || contains(tolower(header), 'surrogate-control') || (contains(tolower(header), 'age:') && !contains(tolower(header), 'age: 0')) || regex('(?i)max-age=[1-9]', header)"

    extractors:
      - type: regex
        part: all
        regex:
          - "(?i)(x-cache|cf-cache-status|age|via|cache-control|surrogate-control):[^\\r\\n]+"
          - "(?i)(location:|href=|src=|canonical|base href|url\\()[^\\r\\n<>]{0,160}(probe-[a-z0-9]+-[a-z0-9]+\\.bb|/probe-[a-z0-9]+-[a-z0-9]+\\.css)[^\\r\\n<>]{0,160}"

