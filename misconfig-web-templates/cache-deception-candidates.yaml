id: cache-deception-candidates

info:
  name: Web Cache Deception Candidate On Sensitive Routes
  author: p3i
  severity: medium
  description: Detects sensitive-looking HTML responses served from static-looking paths with cache-related headers, indicating possible web cache deception risk.
  tags: misconfig,cache,deception,cdn,web
  metadata:
    max-request: 40

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{deception_path}}"

    payloads:
      deception_path:
        - "login/style.css"
        - "login/app.js"
        - "account/profile.css"
        - "account/settings.js"
        - "profile/avatar.png"
        - "user/profile.css"
        - "users/me.css"
        - "me/profile.js"
        - "dashboard/main.css"
        - "dashboard/app.js"
        - "settings/style.css"
        - "billing/invoice.css"
        - "payment/checkout.js"
        - "checkout/cart.css"
        - "admin/app.css"
        - "admin/panel.js"
        - "portal/app.css"
        - "console/main.js"
        - "secure/account.css"
        - "private/profile.js"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "contains(tolower(header), 'content-type: text/html') || contains(tolower(body), '<html') || contains(tolower(body), '<!doctype')"
          - "contains(tolower(header), 'x-cache') || contains(tolower(header), 'cf-cache-status') || contains(tolower(header), 'age:') || contains(tolower(header), 'via:') || contains(tolower(header), 'cache-control: public') || contains(tolower(header), 'max-age') || contains(tolower(header), 's-maxage')"
          - "contains(tolower(body), 'login') || contains(tolower(body), 'sign in') || contains(tolower(body), 'dashboard') || contains(tolower(body), 'account') || contains(tolower(body), 'profile') || contains(tolower(body), 'settings') || contains(tolower(body), 'billing') || contains(tolower(body), 'admin')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)(content-type|cache-control|x-cache|cf-cache-status|age|via):[^\\r\\n]+"

