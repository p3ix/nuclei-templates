id: cache-deception-candidates

info:
  name: Web Cache Deception Candidate On Sensitive Routes
  author: p3i
  severity: medium
  description: Detects sensitive-looking HTML responses served from static-looking paths with cache-related headers, indicating possible web cache deception risk.
  tags: misconfig,cache,deception,cdn,web
  metadata:
    max-request: 40

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{deception_path}}"

    payloads:
      deception_path:
        - "login/style.css"
        - "login/app.js"
        - "account/profile.css"
        - "account/settings.js"
        - "profile/avatar.png"
        - "user/profile.css"
        - "users/me.css"
        - "me/profile.js"
        - "dashboard/main.css"
        - "dashboard/app.js"
        - "settings/style.css"
        - "billing/invoice.css"
        - "payment/checkout.js"
        - "checkout/cart.css"
        - "admin/app.css"
        - "admin/panel.js"
        - "portal/app.css"
        - "console/main.js"
        - "secure/account.css"
        - "private/profile.js"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          # text/html responses are not a deception risk — CDNs rarely cache them for static-looking paths
          - "!contains(tolower(header), 'content-type: text/html')"
          # server must return a static asset content-type OR there must be explicit CDN HIT/Age evidence
          - "contains(tolower(header), 'content-type: text/css') || contains(tolower(header), 'content-type: application/javascript') || contains(tolower(header), 'content-type: text/javascript') || regex('(?i)content-type: image/', header) || regex('(?i)content-type: font/', header) || contains(tolower(header), 'x-cache: hit') || contains(tolower(header), 'cf-cache-status: hit') || contains(tolower(header), 'cf-cache-status: stale') || contains(tolower(header), 's-maxage') || contains(tolower(header), 'surrogate-control') || regex('(?im)^age:\\s*[1-9][0-9]*\\s*$', header)"
          - "!contains(tolower(header), 'x-cache: error') && !contains(tolower(header), 'x-cache: miss') && !contains(tolower(header), 'cache-control: no-cache') && !contains(tolower(header), 'cache-control: private') && !contains(tolower(header), 'cf-cache-status: miss') && !contains(tolower(header), 'cf-cache-status: dynamic') && !contains(tolower(header), 'cf-cache-status: bypass') && !contains(tolower(header), 'cache-control: no-store')"
          - "contains(tolower(body), '<form') || contains(tolower(body), 'password') || contains(tolower(body), 'csrf') || contains(tolower(body), 'invoice') || contains(tolower(body), 'balance') || contains(tolower(body), 'transaction') || contains(tolower(body), 'bearer') || contains(tolower(body), 'access_token')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)(content-type|cache-control|x-cache|cf-cache-status|age|via):[^\\r\\n]+"
