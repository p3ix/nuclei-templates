id: dangerous-http-methods-enabled

info:
  name: Dangerous HTTP Methods Advertised
  author: p3i
  severity: medium
  description: Detects endpoints that advertise dangerous HTTP methods such as PUT, DELETE, or WebDAV methods through Allow or Access-Control-Allow-Methods headers. TRACE is excluded — use trace-method-enabled.yaml for functional TRACE verification (OPTIONS-only TRACE detection produces FPs when the server returns 405 on actual use).
  tags: misconfig,http-methods,webdav,headers,web
  metadata:
    max-request: 10
    false-positives: "REST APIs that legitimately allow DELETE/PUT/PATCH are normal behavior. WebDAV methods (PROPFIND, COPY, MOVE, etc.) in Allow headers on non-WebDAV endpoints are the primary signal."

http:
  - method: OPTIONS
    path:
      - "{{BaseURL}}/{{methods_path}}"

    payloads:
      methods_path:
        - ""
        - "api"
        - "api/"
        - "admin"
        - "upload"
        - "uploads"
        - "files"
        - "static"
        - "assets"
        - "webdav"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204
          - 401
          - 403

      - type: regex
        part: header
        condition: or
        regex:
          - "(?im)^allow:\\s*[^\\r\\n]*(PUT|DELETE|PROPFIND|PROPPATCH|COPY|MOVE|MKCOL|LOCK|UNLOCK)"
          - "(?im)^access-control-allow-methods:\\s*[^\\r\\n]*(PUT|DELETE|PROPFIND|PROPPATCH|COPY|MOVE|MKCOL|LOCK|UNLOCK)"
          - "(?im)^dav:\\s*[^\\r\\n]+"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?im)^(allow|access-control-allow-methods|dav):[^\\r\\n]+"

