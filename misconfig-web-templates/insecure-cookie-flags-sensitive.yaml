id: insecure-cookie-flags-sensitive

info:
  name: Session Cookie Missing Security Flags On Sensitive Pages
  author: p3i
  severity: medium
  description: Detects sensitive pages setting cookies that appear related to sessions or authentication without Secure, HttpOnly, or SameSite attributes.
  tags: misconfig,cookies,session,headers,web
  metadata:
    max-request: 18

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cookie_path}}"

    payloads:
      cookie_path:
        - ""
        - "login"
        - "signin"
        - "auth"
        - "sso"
        - "account"
        - "profile"
        - "settings"
        - "dashboard"
        - "admin"
        - "portal"
        - "console"
        - "billing"
        - "checkout"
        - "cart"
        - "password-reset"
        - "reset-password"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 302
          - 401
          - 403

      # Prerequisite: response must set a cookie before evaluating flag presence
      - type: word
        part: header
        words:
          - "set-cookie:"
        case-insensitive: true

      - type: regex
        part: header
        condition: or
        regex:
          - "(?i)set-cookie:\\s*(session|sid|sess|auth|token|jwt|remember|csrf|xsrf)[^\\r\\n;]*=[^\\r\\n]*(\\r?\\n|$)"
          - "(?i)set-cookie:\\s*[^\\r\\n]*(session|sid|sess|auth|token|jwt|remember)[^\\r\\n]*(\\r?\\n|$)"

      - type: dsl
        dsl:
          # Fire if ANY security flag is missing on a session-named cookie.
          # RE2 note: \b is backspace in RE2, not a word boundary — use ;[\t ]* to match cookie attribute separators.
          - "!regex('(?i)set-cookie:[^\\r\\n]*(session|sid|sess|auth|token|jwt|remember|csrf|xsrf)[^\\r\\n;]*=[^\\r\\n]*;[\\t ]*secure(?:;|[\\r\\n]|$)', header) || !regex('(?i)set-cookie:[^\\r\\n]*(session|sid|sess|auth|token|jwt|remember|csrf|xsrf)[^\\r\\n;]*=[^\\r\\n]*;[\\t ]*httponly(?:;|[\\r\\n]|$)', header) || !regex('(?i)set-cookie:[^\\r\\n]*(session|sid|sess|auth|token|jwt|remember|csrf|xsrf)[^\\r\\n;]*=[^\\r\\n]*samesite=', header)"
          - "!regex('(?i)(okta\\.com|statuspage\\.io|skilljar\\.com|safebase\\.io|pathfactory\\.com|zendesk\\.com|atlassian\\.com|auth0\\.com|intercom\\.io|hubspot\\.com|segment\\.io)', host)"

      # Exclude: analytics/CDN/bot-protection/SFCC cookies that intentionally lack security flags by design
      - type: regex
        part: header
        negative: true
        regex:
          - '(?i)set-cookie:\s*(__cf_bm|_cfuvid|__cflb|__cfduid|_ga|_gid|_gat|_fbp|_fbc|DT|rxVisitor|rxvt|_uetsid|_uetvid|OptanonConsent|CookieConsent|euconsent|dw_dnt|__cq_dnt|cquid|dwac_|datadome)='

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)set-cookie:[^\\r\\n]+"

# FIXED 2026-05-19: Added explicit type:word prerequisite for set-cookie; converted third-party cookie exclusion from DSL to type:regex negative:true; kept complex OR flag-check in DSL (required for RE2 compatibility). Also fixed \b→;[\t ]* in previous session.

