id: missing-hsts-sensitive-hosts

info:
  name: HSTS Missing On Sensitive HTTPS Host
  author: p3i
  severity: low
  description: Detects HTTPS pages on sensitive hostnames or sensitive paths that do not return Strict-Transport-Security.
  tags: misconfig,hsts,headers,tls,web
  metadata:
    max-request: 12

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{hsts_path}}"

    payloads:
      hsts_path:
        - ""
        - "login"
        - "signin"
        - "auth"
        - "sso"
        - "account"
        - "admin"
        - "portal"
        - "billing"
        - "payment"
        - "checkout"
        - "settings"

    attack: batteringram
    redirects: false
    max-redirects: 5
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "regex('^https://', BaseURL)"
          - "contains(tolower(header), 'content-type: text/html')"
          # Exclude Cloudflare edge nodes — they manage HSTS at the CDN layer
          - "!contains(tolower(header), 'cf-ray:')"
          # Exclude Varnish/Fastly CDN edge responses — HSTS is typically managed upstream
          - "!(contains(tolower(header), 'via: 1.1 varnish') && (contains(tolower(header), 'x-served-by:') || contains(tolower(header), 'fastly-restarts') || contains(tolower(header), 'x-fastly-request-id')))"

      # Explicit negative matcher — more reliable than DSL !contains() with redirect chains
      - type: word
        part: header
        negative: true
        words:
          - "strict-transport-security"
        case-insensitive: true

    extractors:
      - type: regex
        part: header
        regex:
          - "(?im)^(server|location|content-type|cache-control):[^\\r\\n]+"
