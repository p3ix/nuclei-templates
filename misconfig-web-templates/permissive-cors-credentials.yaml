id: permissive-cors-credentials

info:
  name: Permissive CORS With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that trust an arbitrary Origin and allow credentials, enabling cross-origin authenticated reads when sensitive data is returned.
  tags: misconfig,cors,credentials,headers,web
  metadata:
    max-request: 14

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "https://cors-bugbounty.example"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "status"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204
          - 301
          - 302
          - 401
          - 403

      - type: dsl
        dsl:
          - "contains(tolower(header), 'access-control-allow-credentials: true')"
          - "contains(tolower(header), 'access-control-allow-origin: https://cors-bugbounty.example')"
          - "!contains(tolower(header), 'access-control-allow-origin: *')"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"

