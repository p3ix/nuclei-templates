id: permissive-cors-credentials

info:
  name: Permissive CORS With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that trust an arbitrary Origin and allow credentials, enabling cross-origin authenticated reads when sensitive data is returned.
  tags: misconfig,cors,credentials,headers,web
  metadata:
    max-request: 16
    verified: false
    false-positives: "Third-party SaaS APIs (HubSpot, Salesforce, etc.) legitimately reflect partner origins with credentials — excluded via Host filter."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "https://nuclei-cors-test.evil.com"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "status"
        - "checkout"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      - type: dsl
        dsl:
          # CASO A (High): server reflects the attacker origin + allows credentials — real authenticated CORS read
          # CASO B (ACAO: * alone): spec forbids combining * with credentials, so * never enables auth reads — not flagged here
          # Server must reflect the exact probe origin — ignoring Origin returns no ACAO header
          - "contains(tolower(header), 'access-control-allow-origin: https://nuclei-cors-test.evil.com')"
          - "contains(tolower(header), 'access-control-allow-credentials: true')"
          # Guard: reject wildcard — a server that echoes * cannot also allow credentials per spec
          - "!contains(tolower(header), 'access-control-allow-origin: *')"
          - "len(body) > 10"
          - "!contains(tolower(body), 'unauthorized')"
          - "!contains(tolower(body), 'unauthenticated')"
          # Exclude known third-party infrastructure that legitimately uses CORS with credentials
          - "!regex('(?i)(hubspot\\.com|office365\\.com|microsoft\\.com|cloudflare\\.com|akamaized\\.net|akamai\\.com|amazonaws\\.com|fastly\\.net|cloudfront\\.net)', Host) && !regex('(?i)^cdn\\.', Host)"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"

