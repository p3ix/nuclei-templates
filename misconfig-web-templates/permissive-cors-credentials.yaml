id: permissive-cors-credentials

info:
  name: Permissive CORS With Credentials
  author: p3i
  severity: high
  description: Detects endpoints that trust an arbitrary Origin and allow credentials, enabling cross-origin authenticated reads when sensitive data is returned.
  tags: misconfig,cors,credentials,headers,web
  metadata:
    max-request: 16
    verified: false
    false-positives: "Third-party SaaS APIs (HubSpot, Salesforce, etc.) legitimately reflect partner origins with credentials — excluded via Host filter."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "https://nuclei-cors-test.evil.com"

    payloads:
      cors_path:
        - ""
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "status"
        - "checkout"

    attack: batteringram
    redirects: false
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # Server must echo back the exact probe origin — a server ignoring Origin returns no ACAO header
      - type: word
        part: header
        words:
          - "access-control-allow-origin: https://nuclei-cors-test.evil.com"
        case-insensitive: true

      # Credentials must be explicitly allowed
      - type: word
        part: header
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true

      # Wildcard cannot be combined with credentials per spec — wildcard responses are not exploitable with credentials
      - type: word
        part: header
        negative: true
        words:
          - "access-control-allow-origin: *"
        case-insensitive: true

      - type: dsl
        dsl:
          - "len(body) > 10"
          # Exclude known third-party infrastructure that legitimately uses CORS with credentials
          - "!regex('(?i)(hubspot\\.com|office365\\.com|microsoft\\.com|cloudflare\\.com|akamaized\\.net|akamai\\.com|amazonaws\\.com|fastly\\.net|cloudfront\\.net)', Host) && !regex('(?i)^cdn\\.', Host)"

      # Exclude: error/challenge interception pages — not real CORS responses
      - type: word
        part: body
        negative: true
        words:
          - "unauthorized"
          - "unauthenticated"
        case-insensitive: true

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"

# FIXED 2026-05-19: Replaced DSL matchers with explicit type:word matchers for ACAO/ACAC; wildcard exclusion and body exclusions converted to type:word negative:true to eliminate :status FPs on servers not reflecting CORS headers.
