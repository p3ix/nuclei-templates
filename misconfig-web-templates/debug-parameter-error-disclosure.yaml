id: debug-parameter-error-disclosure

info:
  name: Debug Parameter Error Disclosure
  author: p3i
  severity: medium
  description: Compares a baseline request with a debug-parameter probe and reports only when the status/body changes with revealing debug output, stack traces, framework errors, absolute paths, or runtime diagnostics.
  tags: misconfig,fuzzing,debug,error-disclosure,stacktrace,web
  metadata:
    max-request: 40

http:
  - raw:
      - |
        GET {{baseline_path}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: nuclei-debug-baseline
        Accept: */*
        Connection: close
      - |
        GET {{debug_probe}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: nuclei-debug-probe
        Accept: */*
        Connection: close

    payloads:
      baseline_path:
        - "/"
        - "/"
        - "/"
        - "/"
        - "/api"
        - "/api"
        - "/login"
        - "/auth"
        - "/search"
        - "/graphql"
        - "/admin"
        - "/dashboard"
        - "/status"
        - "/health"
        - "/actuator"
      debug_probe:
        - "/?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/?trace=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/?show_errors=1&nuclei_probe=bb-debug-{{randstr}}"
        - "/?display_errors=1&nuclei_probe=bb-debug-{{randstr}}"
        - "/api?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/api?trace=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/login?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/auth?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/search?debug=true&q=bb-debug-{{randstr}}"
        - "/graphql?debug=true&query=bb-debug-{{randstr}}"
        - "/admin?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/dashboard?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/status?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/health?debug=true&nuclei_probe=bb-debug-{{randstr}}"
        - "/actuator?debug=true&nuclei_probe=bb-debug-{{randstr}}"

    attack: pitchfork
    req-condition: true
    redirects: false
    max-redirects: 1
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 != status_code_2 || (body_1 != body_2 && regex('(?i)(stack trace|traceback \\(most recent call last\\)|exception|error at line|undefined variable|syntax error|warning:|fatal error|notice:|xdebug|whoops|symfony profiler|laravel debugbar|django debug|rails application trace|express error|java\\.lang\\.|at com\\.|nullpointerexception|sqlexception|pdoexception|queryexception|sql syntax|server variables|request headers|environment variables|APP_DEBUG|DEBUG\\s*=\\s*true|/var/www|/usr/local|/home/[a-z0-9_.-]+|C:\\\\\\\\[A-Za-z0-9_. -]+|Django/[0-9]|Laravel Framework|Symfony/[0-9]|Ruby on Rails|Express/[0-9]|PHP/[0-9]|Node\\.js)', body_2))"
          - >-
            regex('(?i)(stack trace|traceback \\(most recent call last\\)|exception|error at line|undefined variable|syntax error|warning:|fatal error|notice:|xdebug|whoops|symfony profiler|laravel debugbar|django debug|rails application trace|express error|java\\.lang\\.|at com\\.|nullpointerexception|sqlexception|pdoexception|queryexception|sql syntax|server variables|request headers|environment variables|APP_DEBUG|DEBUG\\s*=\\s*true|/var/www|/usr/local|/home/[a-z0-9_.-]+|C:\\\\\\\\[A-Za-z0-9_. -]+|Django/[0-9]|Laravel Framework|Symfony/[0-9]|Ruby on Rails|Express/[0-9]|PHP/[0-9]|Node\\.js)', body_2)
          - "!contains(tolower(body_2), '<title>404')"
          - "!contains(tolower(body_2), 'page not found')"
          - "len(body_2) < 20971520"

    extractors:
      - type: regex
        part: body_2
        regex:
          - "(?im)(stack trace|traceback \\(most recent call last\\)|exception|error at line|undefined variable|syntax error|warning:|fatal error|notice:|xdebug|whoops|symfony profiler|laravel debugbar|django debug|rails application trace|express error|java\\.lang\\.|at com\\.|nullpointerexception|sqlexception|pdoexception|queryexception|sql syntax|/var/www|/usr/local|/home/[a-z0-9_.-]+|C:\\\\[A-Za-z0-9_. -]+|Django/[0-9]|Laravel Framework|Symfony/[0-9]|Ruby on Rails|Express/[0-9]|PHP/[0-9]|Node\\.js).{0,160}"
          - "(?im)(password|token|secret|api[_-]?key|database_url|jdbc:|mongodb://|redis://).{0,160}"
      - type: dsl
        name: baseline_status
        dsl:
          - "status_code_1"
      - type: dsl
        name: probe_status
        dsl:
          - "status_code_2"
