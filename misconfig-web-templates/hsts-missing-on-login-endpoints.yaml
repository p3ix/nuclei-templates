# Focused HSTS check for authentication endpoints.
# Uses an explicit negative:true word matcher — more reliable than DSL negation when redirects:true
# is set, because DSL !contains() sees concatenated headers from all hops in the redirect chain.
id: hsts-missing-on-login-endpoints

info:
  name: HSTS Missing On Authentication Endpoints
  author: p3i
  severity: medium
  description: Detects HTTPS authentication pages that do not return Strict-Transport-Security, allowing potential HTTP downgrade attacks on login flows. Only fires when the header is completely absent — max-age=0 (intentional opt-out) is also excluded since any HSTS header presence stops the matcher.
  tags: misconfig,hsts,headers,tls,auth,web
  metadata:
    max-request: 5
    verified: false
    false-positives: "Servers behind CDNs (Cloudflare, Fastly, Varnish) that inject HSTS at the edge — excluded via cf-ray and varnish header checks. Servers that set HSTS only on the root path and not on sub-paths will fire; verify manually."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{auth_path}}"

    payloads:
      auth_path:
        - "login"
        - "signin"
        - "account"
        - "auth"
        - "sso"

    attack: batteringram
    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          # Strict-Transport-Security is only valid on HTTPS — never fire on HTTP targets
          - "regex('^https://', BaseURL)"
          - "contains(tolower(header), 'content-type: text/html')"
          # Exclude CDN edges that manage HSTS upstream before the header reaches the browser
          - "!contains(tolower(header), 'cf-ray:')"
          - "!(contains(tolower(header), 'via: 1.1 varnish') && (contains(tolower(header), 'x-served-by:') || contains(tolower(header), 'x-fastly-request-id')))"

      # Explicit negative matcher — fires only when Strict-Transport-Security is completely absent.
      # Separated from the DSL block intentionally: negative:true is unambiguous about header absence,
      # whereas DSL !contains() can be confused by redirect-chain header concatenation in some builds.
      - type: word
        part: header
        negative: true
        words:
          - "Strict-Transport-Security"

    extractors:
      - type: regex
        part: header
        regex:
          - "(?im)^(server|content-type|cache-control):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"

# FIXED 2026-05-19: Uses explicit type:word negative:true matcher for Strict-Transport-Security instead of DSL !contains — unambiguous about header absence even when redirects:true concatenates multi-hop headers. Eliminates FPs on hosts with HSTS preload.
