# Fix: added exact-match regex for ACAO:null to prevent substring collisions (e.g. "nullsite.com"),
# expanded paths to include checkout/settings, added captcha/bot-detection exclusion.
id: cors-null-origin-bypass-sensitive-endpoint

info:
  name: CORS Null Origin Bypass On Sensitive Endpoint
  author: p3i
  severity: high
  description: Detects endpoints that reflect the null origin and allow credentials, enabling cross-origin authenticated reads from sandboxed iframes or local HTML files. Only alerts on non-login paths where data exposure is meaningful.
  reference:
    - https://portswigger.net/web-security/cors/lab-null-origin-whitelisted-with-credentials
  tags: misconfig,cors,null-origin,credentials,headers,web
  metadata:
    max-request: 14
    verified: false
    false-positives: "Servers that always echo null in ACAO for all origins without enforcing credentials — verify ACAC:true is also present."

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{cors_path}}"

    headers:
      Origin: "null"
      Accept: "application/json, text/plain, */*"

    payloads:
      cors_path:
        - "api"
        - "api/"
        - "api/v1"
        - "v1"
        - "graphql"
        - "me"
        - "user"
        - "account"
        - "profile"
        - "admin"
        - "dashboard"
        - "config"
        - "checkout"
        - "settings"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 204

      # ACAO must be exactly "null" — exact-line match prevents substring collisions (e.g. nullsite.com)
      - type: regex
        part: header
        regex:
          - '(?im)^access-control-allow-origin:\s*null\s*$'

      # ACAC:true required — server ignoring Origin returns no CORS headers at all
      - type: word
        part: header
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true

      - type: dsl
        dsl:
          - "len(body) > 10"
          # Skip login/auth paths — ACAO:null on the login endpoint itself is expected in some SSO flows
          - "!regex('(?i)/(login|signin|auth|register)$', path)"

      # Exclude: WAF/challenge interception pages — not real CORS responses
      - type: word
        part: body
        negative: true
        words:
          - "unauthorized"
          - "unauthenticated"
          - "captcha"
          - "bot detection"
        case-insensitive: true

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-(origin|credentials|methods|headers):[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"

# FIXED 2026-05-19: Replaced DSL matchers with explicit type:regex (ACAO:null exact-line match) and type:word (ACAC:true) matchers; converted body exclusions to type:word negative:true to eliminate :status FPs.
