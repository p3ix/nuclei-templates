id: request-smuggling-tete-obfuscation-oracle

info:
  name: HTTP Request Smuggling TE.TE Obfuscation Timing Oracle
  author: p3i
  severity: medium
  description: Tests Transfer-Encoding obfuscation variants twice and reports only when both attempts for the same variant are slow AND the baseline was fast, reducing false positives from slow servers or high-latency connections. Requires actual proxy/CDN headers (Via, X-Cache, CF-Ray, etc.) to filter direct-server hits. These are TE.TE request smuggling candidates and require manual confirmation.
  tags: misconfig,request-smuggling,desync,tete,transfer-encoding,timing,http
  metadata:
    max-request: 108

http:
  - raw:
      - |
        GET {{smuggle_path}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: nuclei-tete-baseline
        Connection: close
      - |
        POST {{smuggle_path}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: nuclei-tete-oracle
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 4
        {{te_header}}
        Connection: keep-alive

        1
        Z
        Q
      - |
        POST {{smuggle_path}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: nuclei-tete-oracle
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 4
        {{te_header}}
        Connection: keep-alive

        1
        Z
        Q

    payloads:
      smuggle_path:
        - "/"
        - "/api"
        - "/login"
        - "/health"
      te_header:
        - "Transfer-Encoding: xchunked"
        - "Transfer-Encoding: chunked, x"
        - "Transfer-Encoding: chunked; x=y"
        - "Transfer-Encoding : chunked"
        - "X-Transfer-Encoding: chunked"
        - "Transfer_Encoding: chunked"
        - "Transfer-Encoding:\tchunked"
        - "Transfer-Encoding: chunKed"
        - "Transfer-Encoding: chunked"

    attack: clusterbomb
    unsafe: true
    req-condition: true
    redirects: false
    max-redirects: 0
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "duration_1 < 2.5 && duration_2 >= 9 && duration_3 >= 9"
          - "duration_1 < 2.5 && duration_2 >= duration_1 + 7 && duration_3 >= duration_1 + 7"

      - type: regex
        part: all
        condition: or
        regex:
          - "(?i)^(via|x-cache|cf-ray|x-amz-cf-|x-envoy|x-varnish|x-served-by|x-akamai):"
          - "(?i)(cloudflare|akamai|fastly|cloudfront|varnish|envoy|haproxy|awselb|alb)"

    extractors:
      - type: dsl
        name: te_variant
        dsl:
          - "te_header"
      - type: regex
        part: all
        regex:
          - "(?im)^(server|via|x-cache|cf-ray|x-amz-cf-[^:]+|x-envoy[^:]*|x-varnish|x-served-by|x-akamai[^:]*|x-request-id|x-correlation-id):[^\\r\\n]+"
      - type: dsl
        name: duration_baseline
        dsl:
          - "duration_1"
      - type: dsl
        name: duration_first_probe
        dsl:
          - "duration_2"
      - type: dsl
        name: duration_second_probe
        dsl:
          - "duration_3"
      - type: dsl
        name: status_baseline
        dsl:
          - "status_code_1"
      - type: dsl
        name: status_first_probe
        dsl:
          - "status_code_2"
      - type: dsl
        name: status_second_probe
        dsl:
          - "status_code_3"
