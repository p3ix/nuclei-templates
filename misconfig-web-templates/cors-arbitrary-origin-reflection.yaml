id: cors-arbitrary-origin-reflection

info:
  name: CORS Arbitrary Origin Reflection Without Credentials
  author: p3i
  severity: medium
  description: Detects API endpoints that reflect any arbitrary Origin header in Access-Control-Allow-Origin without validating the domain. Without Access-Control-Allow-Credentials, this allows any website to read the API response cross-origin. Risk escalates when the endpoint returns sensitive data or is coupled with cookie-based auth that the attacker can trigger from another context.
  tags: misconfig,cors,origin-reflection,api,web
  metadata:
    max-request: 8

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{api_path}}"

    payloads:
      api_path:
        - ""
        - "api/"
        - "api/v1/"
        - "api/v2/"
        - "v1/"
        - "v2/"
        - "rest/"
        - "graphql"

    headers:
      Origin: "https://arbitrary-cors-probe.example.com"

    attack: batteringram
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # ACAO must reflect exactly the canary and be pinned to the header name —
      # checking only the domain substring fires on any header that echoes the Origin
      # (CSP connect-src, Link, X-Echo-*, etc.).
      - type: word
        part: header
        words:
          - "access-control-allow-origin: https://arbitrary-cors-probe.example.com"
        case-insensitive: true

      # This template covers the no-credentials case; with-credentials is cors-origin-reflection-with-credentials.
      - type: word
        part: header
        negative: true
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true

      # Require a non-HTML API response — arbitrary ACAO on public HTML pages is usually intentional.
      # "len(body) > 30" matched any non-empty response and was removed.
      - type: regex
        part: header
        regex:
          - "(?i)content-type:\\s*(application/json|application/xml|application/|text/plain|text/xml)"

      # Exclude WAF/challenge interception pages — not real CORS responses.
      - type: word
        part: body
        negative: true
        words:
          - "captcha"
          - "bot detection"
          - "unauthorized"
          - "unauthenticated"
        case-insensitive: true

    extractors:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-origin:[^\\r\\n]+"
          - "(?i)access-control-allow-methods:[^\\r\\n]+"
      - type: dsl
        name: status
        dsl:
          - "status_code"
